# Checks and builds on GitHub's runners, then publishes the built app to the `deploy` branch.
# Hyperlift deploys from `deploy` and only installs and starts it: `next build` needs about
# 1.4 GB of memory, more than the Small plan's builder has.
name: Build and publish deploy branch

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Public values that ship to every browser; not secrets.
      NEXT_PUBLIC_SUPABASE_URL: https://hkgaercmtdmoksrhzcya.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_5XZ3UcX0qeI0RpgJ3kBcuQ_pqPEeZ3R
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npx eslint .
      - run: npx vitest run --maxWorkers=2
      - run: npm run build
      - run: npx vitest run src/lib/perf-budget.test.ts
      - name: Publish deploy branch
        run: |
          set -e
          out="$(mktemp -d)"
          git archive HEAD | tar -x -C "$out"
          rm -rf "$out/.github"
          cp -r .next "$out/.next"
          rm -rf "$out/.next/cache" "$out/.next/dev"
          cp docker/runtime.Dockerfile "$out/Dockerfile"
          cp docker/runtime.dockerignore "$out/.dockerignore"
          cd "$out"
          git init -q -b deploy
          git add -A
          git add -f .next
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -q -m "Build of ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" deploy
