# Push staging to run every check before publishing.
# After checks pass, GitHub fast-forwards master to the tested commit.
# Vercel deploys production from master; staging gets a preview.
# A direct push to master skips checks and must not be used.
name: Checks

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Public values that ship to every browser; not secrets.
      NEXT_PUBLIC_SUPABASE_URL: https://hkgaercmtdmoksrhzcya.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_5XZ3UcX0qeI0RpgJ3kBcuQ_pqPEeZ3R
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: BII-sbmPmyH4vMDFh8tm3VPPzQOV3H5MHt_J3zv7duLu66LNpyhvc9TsLy4Htrs8gb_W1l6b6DodnhYtBBb4cVI
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npx eslint .
      - run: npm run audit:release
      - run: npx vitest run --maxWorkers=2
      - run: npm run build
      - run: npx vitest run src/lib/perf-budget.test.ts

  promote:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fast-forward master to the tested commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          if ! git merge-base --is-ancestor origin/master "$GITHUB_SHA"; then
            echo "::error::Cannot promote: merge or rebase staging on master, then push staging again."
            exit 1
          fi
          if [ "$(git rev-parse origin/master)" = "$GITHUB_SHA" ]; then
            echo "master already points at the tested commit; nothing to promote."
            exit 0
          fi
          git push origin "$GITHUB_SHA:refs/heads/master"
