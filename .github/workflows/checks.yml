# Checks every push to master. Vercel builds and deploys from master on its own (2026-11-05);
# the old Hyperlift `deploy` branch is no longer published.
name: Checks

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Public values that ship to every browser; not secrets.
      NEXT_PUBLIC_SUPABASE_URL: https://hkgaercmtdmoksrhzcya.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_5XZ3UcX0qeI0RpgJ3kBcuQ_pqPEeZ3R
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: BII-sbmPmyH4vMDFh8tm3VPPzQOV3H5MHt_J3zv7duLu66LNpyhvc9TsLy4Htrs8gb_W1l6b6DodnhYtBBb4cVI
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npx eslint .
      - run: npm run audit:release
      - run: npx vitest run --maxWorkers=2
      - run: npm run build
      - run: npx vitest run src/lib/perf-budget.test.ts
