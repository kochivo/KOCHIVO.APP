<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rank share image v2</title>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;500;700;900&family=Manrope:wght@500;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{background:#141516;color:#f1f0eb;font-family:Alexandria,sans-serif;padding:36px 24px 48px}
h1{font-size:22px;font-weight:700;margin-bottom:4px}
h2{font-size:17px;font-weight:700;margin:34px 0 4px;color:#e9e9e4}
.sub{color:#9a9c98;font-size:14px;margin-bottom:18px}
.row{display:flex;flex-wrap:wrap;gap:28px;justify-content:center}
.frame{width:360px;height:640px;border-radius:26px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.story{width:1080px;height:1920px;transform:scale(.33333);transform-origin:top right;position:relative;overflow:hidden;background:#050505}
.grain{position:absolute;inset:0;opacity:.13;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.cap{font-size:14px;color:#c9cac5;text-align:center;margin-top:10px}

/* ---------- A: stage ---------- */
.A{display:flex;flex-direction:column;align-items:center}
.A .beam{position:absolute;top:-40px;left:50%;width:1100px;height:1250px;transform:translateX(-50%);clip-path:polygon(41% 0,59% 0,100% 100%,0 100%);background:linear-gradient(180deg,var(--c1a) 0%,var(--c2b) 45%,transparent 92%);filter:blur(6px)}
.A .halo{position:absolute;top:330px;left:50%;width:900px;height:900px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,var(--c2b) 0%,transparent 62%)}
.A .border{position:absolute;inset:38px;border:2px solid var(--c2c);border-radius:44px}
.A .corner{position:absolute;width:90px;height:90px;border:6px solid var(--c1);opacity:.85}
.A .tl{top:24px;left:24px;border-right:0;border-bottom:0;border-radius:52px 0 0 0}
.A .tr{top:24px;right:24px;border-left:0;border-bottom:0;border-radius:0 52px 0 0}
.A .bl{bottom:24px;left:24px;border-right:0;border-top:0;border-radius:0 0 0 52px}
.A .br{bottom:24px;right:24px;border-left:0;border-top:0;border-radius:0 0 52px 0}
.A .logo{position:relative;height:74px;margin-top:100px}
.A .ribbon{position:relative;display:flex;align-items:center;gap:26px;margin-top:40px;font-size:38px;font-weight:500;color:var(--c1);letter-spacing:1px}
.A .ribbon i{display:block;width:120px;height:2px;background:linear-gradient(90deg,transparent,var(--c1))}
.A .ribbon i:last-child{transform:scaleX(-1)}
.A .medal{position:relative;width:740px;height:740px;margin:-20px 0 -60px;filter:drop-shadow(0 50px 70px rgba(0,0,0,.75))}
.A .medal svg,.A .refl svg{width:100%;height:100%}
.A .floor{position:relative;width:760px;height:2px;margin-top:-34px;background:linear-gradient(90deg,transparent,var(--c1),transparent);opacity:.7}
.A .refl{display:none;position:relative;width:640px;height:200px;overflow:hidden;opacity:.18;transform:scaleY(-1);-webkit-mask:linear-gradient(0deg,#000,transparent 80%);mask:linear-gradient(0deg,#000,transparent 80%)}
.A .refl div{width:640px;height:640px}
.A .tier{position:relative;margin-top:0;font-size:200px;font-weight:900;line-height:1.1;background:linear-gradient(180deg,var(--c0) 8%,var(--c1) 38%,var(--c3) 62%,var(--c1) 80%,var(--c0));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 rgba(0,0,0,.6)) drop-shadow(0 0 50px var(--c2c))}
.A .name{position:relative;font-family:Manrope,sans-serif;font-size:78px;font-weight:800;direction:ltr;margin-top:-6px}
.A .ladder{position:relative;display:flex;gap:22px;align-items:center;margin-top:36px;direction:ltr}
.A .ladder b{width:30px;height:30px;transform:rotate(45deg);border:3px solid rgba(255,255,255,.22);border-radius:6px}
.A .ladder b.on{background:linear-gradient(135deg,var(--c0),var(--c2));border-color:transparent}
.A .ladder b.now{width:44px;height:44px;box-shadow:0 0 30px var(--c1),0 0 0 6px var(--c2c)}
.A .step{position:relative;margin-top:22px;font-size:32px;color:#a9aaa5}
.A .plaque{position:relative;display:flex;margin-top:40px;border-radius:36px;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:2px solid var(--c2c);overflow:hidden}
.A .plaque div{width:300px;padding:30px 0 26px;text-align:center}
.A .plaque div+div{border-right:2px solid var(--c2c)}
.A .plaque b{display:block;font-family:Manrope,sans-serif;font-size:80px;font-weight:800;line-height:1;color:#fff}
.A .plaque span{display:block;margin-top:12px;font-size:32px;color:var(--c1)}
.A .foot{position:absolute;bottom:96px;left:0;right:0;text-align:center}
.A .foot p{font-size:36px;color:#b9bab5}
.A .foot small{display:block;margin-top:16px;font-family:Manrope,sans-serif;font-size:30px;font-weight:800;color:#b8ea4f;letter-spacing:5px;direction:ltr}

/* ---------- B: poster ---------- */
.B .ghost{position:absolute;top:120px;right:-40px;font-size:640px;font-weight:900;line-height:.9;color:transparent;-webkit-text-stroke:4px var(--c2c);opacity:.8;white-space:nowrap}
.B .wash{position:absolute;inset:0;background:radial-gradient(70% 45% at 70% 30%,var(--c2b),transparent 70%),linear-gradient(180deg,transparent 45%,#050505 78%)}
.B .band{position:absolute;top:640px;left:-200px;width:1600px;height:250px;transform:rotate(-14deg);background:linear-gradient(90deg,#b8ea4f00,#b8ea4f 30%,#9fd23a 70%,#b8ea4f00);opacity:.92}
.B .band span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:60px;font-family:Manrope,sans-serif;font-size:56px;font-weight:800;color:#0b0d06;letter-spacing:10px;direction:ltr;white-space:nowrap}
.B .medal{position:absolute;top:250px;left:50%;width:760px;height:760px;transform:translateX(-50%);filter:drop-shadow(0 60px 80px rgba(0,0,0,.85))}
.B .medal svg{width:100%;height:100%}
.B .top{position:absolute;top:96px;right:90px;left:90px;display:flex;justify-content:space-between;align-items:center}
.B .logo{height:74px}
.B .num{font-family:Manrope,sans-serif;font-size:34px;font-weight:800;color:var(--c1);direction:ltr;border:2px solid var(--c2c);border-radius:999px;padding:14px 30px}
.B .text{position:absolute;right:90px;left:90px;bottom:120px}
.B .lab{font-size:40px;font-weight:500;color:#cfd0cb}
.B .tier{font-size:230px;font-weight:900;line-height:1.05;background:linear-gradient(180deg,var(--c0) 10%,var(--c1) 45%,var(--c3) 75%,var(--c1));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 40px var(--c2c))}
.B .name{font-family:Manrope,sans-serif;font-size:96px;font-weight:800;direction:ltr;text-align:right;margin-top:-10px}
.B .stats{display:flex;gap:70px;margin-top:56px;padding-top:44px;border-top:2px solid rgba(255,255,255,.14)}
.B .stats b{display:block;font-family:Manrope,sans-serif;font-size:96px;font-weight:800;line-height:1;color:#fff}
.B .stats span{display:block;font-size:32px;color:#a9aaa5;margin-top:10px}
.B .stats .cap2 b{font-family:Alexandria,sans-serif;font-size:50px;font-weight:700;padding-top:30px;color:var(--c1)}
.B .url{margin-top:56px;display:flex;justify-content:space-between;font-size:32px;color:#8d8e8a}
.B .url small{font-family:Manrope,sans-serif;font-size:30px;font-weight:800;color:#b8ea4f;letter-spacing:5px;direction:ltr}
</style></head><body>
<h1>صورة مشاركة الرتبة · موكاب v2</h1>
<p class="sub">اتجاهين. كل واحد مقاس ستوري 1080×1920، ولونه بيتغير مع الرتبة.</p>
<h2>اتجاه A · المنصة: الميدالية تحت سبوت لايت، إطار محفور، وسلم الرتب السبعة</h2>
<div class="row" id="A"></div>
<h2>اتجاه B · بوستر: اسم الرتبة ضخم ورا الميدالية، شريط KOCHIVO الليموني، وكل الكلام تحت</h2>
<div class="row" id="B"></div>
<script>const T = [
  { n: 'حديد', p: 0,   s: ['#f1f3f5', '#a3a9b0', '#5d636a', '#2c3035', '#8e959c', '#d9dde1'] },
  { n: 'برونز', p: 100, s: ['#ffe2c6', '#e09a63', '#9a5527', '#4a220b', '#c47a42', '#ffd0a6'] },
  { n: 'فضة', p: 200,  s: ['#ffffff', '#d7dde3', '#8f9aa5', '#3e4650', '#b9c3cc', '#f4f7fa'] },
  { n: 'ذهب', p: 300,  s: ['#fffbe0', '#ffd96b', '#d39b26', '#6e4708', '#e8b23e', '#fff0b0'] },
  { n: 'بلاتين', p: 400, s: ['#ffffff', '#d9fff5', '#8fd9c7', '#2f6e62', '#b5ecdf', '#f0fffb'] },
  { n: 'ماس', p: 600,  s: ['#ffffff', '#cfe3ff', '#7aa8ff', '#1f3f99', '#a9c8ff', '#eef5ff'] },
  { n: 'أسطورة', p: 900, s: ['#fffbe6', '#f4ffb8', '#b6e94f', '#40600a', '#e6c65a', '#fff3c4'] },
];
const P = (pts) => 'M' + pts.map(p => p.map(v => v.toFixed(2)).join(' ')).join(' L') + 'Z';
const star = (cx, cy, R, r, n = 5, rot = -90) => P(Array.from({ length: n * 2 }, (_, i) => { const a = (rot + i * 180 / n) * Math.PI / 180, rad = i % 2 ? r : R; return [cx + Math.cos(a) * rad, cy + Math.sin(a) * rad]; }));
const sparkle = (x, y, s, c) => `<path d="M${x} ${y - s} Q${x} ${y} ${x + s} ${y} Q${x} ${y} ${x} ${y + s} Q${x} ${y} ${x - s} ${y} Q${x} ${y} ${x} ${y - s}Z" fill="${c}"/>`;

function defs(id, t, locked) {
  const s = locked ? ['#3a3d40', '#2a2c2f', '#1b1c1e', '#0e0f10', '#232527', '#34373a'] : t.s;
  return `<defs>
    <linearGradient id="${id}m" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="${s[0]}"/><stop offset=".22" stop-color="${s[1]}"/><stop offset=".48" stop-color="${s[2]}"/>
      <stop offset=".62" stop-color="${s[3]}"/><stop offset=".82" stop-color="${s[4]}"/><stop offset="1" stop-color="${s[5]}"/></linearGradient>
    <linearGradient id="${id}v" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s[1]}"/><stop offset=".55" stop-color="${s[2]}"/><stop offset="1" stop-color="${s[3]}"/></linearGradient>
    <radialGradient id="${id}r" cx=".5" cy=".38" r=".7"><stop offset="0" stop-color="${s[2]}" stop-opacity=".55"/><stop offset=".6" stop-color="#0a0b0c"/><stop offset="1" stop-color="#050505"/></radialGradient>
    <linearGradient id="${id}gem" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="${locked ? '#2a2c2f' : (t.n === 'أسطورة' ? '#d8ff86' : t.s[1])}"/><stop offset="1" stop-color="${locked ? '#111' : t.s[3]}"/></linearGradient>
    <radialGradient id="${id}aura" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="${s[2]}" stop-opacity=".55"/><stop offset="1" stop-color="${s[2]}" stop-opacity="0"/></radialGradient>
    <linearGradient id="${id}sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="${id}clip"><circle cx="60" cy="62" r="30"/></clipPath>
  </defs>`;
}

function emblem(r, id, { locked = false, shine = false } = {}) {
  const t = T[r], m = `url(#${id}m)`, v = `url(#${id}v)`, dark = locked ? '#0c0d0e' : t.s[3], hi = locked ? '#45484c' : t.s[0];
  const R = 26 + r * 1.3;
  let back = '', front = '';
  if (r >= 5 && !locked) back += `<circle cx="60" cy="62" r="${R + 30}" fill="url(#${id}aura)"/>`;
  if (r >= 3) {
    const n = 20, rays = Array.from({ length: n }, (_, i) => {
      const a = (i * 360 / n - 90) * Math.PI / 180, b = a + .07, c = a - .07, L = R + 14 + (i % 2 ? 0 : 7);
      return `<path d="M60 62 L${60 + Math.cos(b) * L} ${62 + Math.sin(b) * L} L${60 + Math.cos(c) * L} ${62 + Math.sin(c) * L}Z"/>`;
    }).join('');
    back += `<g fill="${v}" opacity="${r >= 6 ? .95 : .75}">${rays}</g>`;
  }
  if (r >= 4) {
    const wing = (sd) => {
      const f = (k) => { const y = 50 + k * 8, len = 34 - k * 5;
        return `<path d="M${60 + sd * (R - 4)} ${y + 6} C${60 + sd * (R + len * .5)} ${y - 4}, ${60 + sd * (R + len)} ${y - 6 - k * 2}, ${60 + sd * (R + len + 6)} ${y - 12 - k * 3} C${60 + sd * (R + len * .8)} ${y + 4}, ${60 + sd * (R + 6)} ${y + 12}, ${60 + sd * (R - 4)} ${y + 14}Z" fill="${m}" stroke="${dark}" stroke-width=".7"/>`; };
      return [3, 2, 1, 0].map(f).join('');
    };
    back += wing(1) + wing(-1);
  }
  if (r >= 3) {
    const leaves = (sd) => Array.from({ length: 6 }, (_, i) => {
      const deg = sd < 0 ? 102 + i * 17 : 78 - i * 17, a = deg * Math.PI / 180, x = 60 + Math.cos(a) * (R + 5), y = 62 + Math.sin(a) * (R + 5);
      return `<ellipse cx="${x}" cy="${y}" rx="2.6" ry="6.4" transform="rotate(${deg + sd * 30} ${x} ${y})" fill="${m}" stroke="${dark}" stroke-width=".5"/>`;
    }).join('');
    back += leaves(1) + leaves(-1);
  }
  /* medallion body */
  let body;
  if (r === 0) {
    body = `<path d="${P(Array.from({ length: 6 }, (_, i) => { const a = (i * 60 - 90) * Math.PI / 180; return [60 + Math.cos(a) * (R + 2), 62 + Math.sin(a) * (R + 2)]; }))}" fill="${m}" stroke="${dark}" stroke-width="1"/>
      <circle cx="60" cy="62" r="${R - 8}" fill="url(#${id}r)" stroke="${hi}" stroke-opacity=".5"/>`;
  } else {
    body = `<circle cx="60" cy="62" r="${R + 1.5}" fill="${dark}"/><circle cx="60" cy="62" r="${R}" fill="${m}"/>
      ${r >= 2 ? Array.from({ length: 48 }, (_, i) => { const a = i * 7.5 * Math.PI / 180; return `<line x1="${60 + Math.cos(a) * (R - 1.5)}" y1="${62 + Math.sin(a) * (R - 1.5)}" x2="${60 + Math.cos(a) * (R - 4)}" y2="${62 + Math.sin(a) * (R - 4)}" stroke="${dark}" stroke-width=".8" opacity=".55"/>`; }).join('') : ''}
      <circle cx="60" cy="62" r="${R - 6}" fill="url(#${id}r)" stroke="${hi}" stroke-opacity=".6" stroke-width=".8"/>`;
  }
  /* center motif */
  let motif = '';
  if (r === 0) motif = `<rect x="52" y="59" width="16" height="6" rx="2" fill="${m}"/>`;
  if (r === 1) motif = `<path d="M48 58 L60 68 L72 58 L72 64 L60 74 L48 64Z" fill="${m}" stroke="${dark}" stroke-width=".6"/>`;
  if (r === 2 || r === 3) motif = `<path d="${star(60, 62, 13 + r, 5.6 + r * .6)}" fill="${m}" stroke="${dark}" stroke-width=".6"/><path d="${star(60, 62, 6, 2.6)}" fill="${hi}" opacity=".55"/>`;
  if (r === 4) motif = `<circle cx="60" cy="62" r="11" fill="url(#${id}gem)" stroke="${hi}" stroke-width=".8"/><path d="M53 58 L60 53 L67 58 L60 71Z" fill="#fff" opacity=".35"/><path d="M49 62 L60 53 L71 62" fill="none" stroke="#fff" opacity=".4" stroke-width=".6"/>`;
  if (r >= 5) motif = `<path d="M47 57 L53 50 L67 50 L73 57 L60 76Z" fill="url(#${id}gem)" stroke="${hi}" stroke-width=".8"/>
      <path d="M47 57 L73 57 M53 50 L57 57 L60 76 M67 50 L63 57 L60 76 M57 57 L60 50 L63 57" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width=".6"/>
      <path d="M53 50 L57 57 L47 57Z" fill="#fff" opacity=".35"/>`;
  /* crown / tiara */
  if (r === 5) front += `<path d="M${60 - 14} ${62 - R - 1} L${60 - 10} ${62 - R - 10} L${60 - 4} ${62 - R - 4} L60 ${62 - R - 14} L${60 + 4} ${62 - R - 4} L${60 + 10} ${62 - R - 10} L${60 + 14} ${62 - R - 1}Z" fill="${m}" stroke="${dark}" stroke-width=".6"/><circle cx="60" cy="${62 - R - 14}" r="2" fill="url(#${id}gem)"/>`;
  if (r === 6) front += `<path d="M38 ${62 - R + 2} L36 ${62 - R - 18} L47 ${62 - R - 8} L53 ${62 - R - 24} L60 ${62 - R - 10} L67 ${62 - R - 24} L73 ${62 - R - 8} L84 ${62 - R - 18} L82 ${62 - R + 2}Z" fill="${m}" stroke="${dark}" stroke-width=".8"/>
      <rect x="38" y="${62 - R - 2}" width="44" height="5" rx="2" fill="${v}"/>
      ${[36, 53, 67, 84].map(x => `<circle cx="${x}" cy="${62 - R - (x === 36 || x === 84 ? 18 : 24)}" r="2.4" fill="url(#${id}gem)"/>`).join('')}
      <circle cx="60" cy="${62 - R - 12}" r="3.2" fill="url(#${id}gem)" stroke="${hi}" stroke-width=".5"/>`;
  const glints = !locked && r >= 4 ? sparkle(60 + R + 8, 62 - R + 4, 4 + r * .4, '#fff') + sparkle(60 - R - 4, 62 + R - 8, 2.6 + r * .3, '#fff') + (r >= 6 ? sparkle(60 + 6, 62 - R - 30, 3.5, '#fff') : '') : '';
  const sheen = shine && !locked ? `<g clip-path="url(#${id}clip)"><rect class="shine" x="30" y="20" width="22" height="90" fill="url(#${id}sh)" transform="skewX(-18)"/></g>` : '';
  const lock = locked ? `<g transform="translate(60 63)"><rect x="-7" y="-2" width="14" height="11" rx="2.5" fill="#55595e"/><path d="M-4.5 -2 V-5 a4.5 4.5 0 0 1 9 0 V-2" fill="none" stroke="#55595e" stroke-width="2"/></g>` : '';
  const ground = `<ellipse cx="60" cy="${62 + R + 22}" rx="${R + 6}" ry="3.5" fill="#000" opacity=".55"/>`;
  return `<svg viewBox="-10 -6 140 136" role="img" aria-label="${t.n}">${defs(id, t, locked)}${ground}${back}${body}${motif}${front}${sheen}${lock}${glints}</svg>`;
}


const demo=[{r:6,pts:915,w:126},{r:3,pts:312,w:41},{r:0,pts:35,w:4}];
const NAME='Youssef',CAP='Ali Esmail',LOGO='../captain-workspace/kochivo-logo.png';
const a=(h,x)=>h+Math.round(x*255).toString(16).padStart(2,'0');
const vars=s=>'--c0:'+s[0]+';--c1:'+s[1]+';--c2:'+s[2]+';--c3:'+s[3]+';--c1a:'+a(s[1],.32)+';--c2b:'+a(s[2],.42)+';--c2c:'+a(s[2],.4);
const wrap=(t,body)=>'<div><div class="frame">'+body+'</div><p class="cap">'+t.n+'</p></div>';
document.getElementById('A').innerHTML=demo.map((d,i)=>{const t=T[d.r];
 const ladder=T.map((_,k)=>'<b class="'+(k<=d.r?'on':'')+(k===d.r?' now':'')+'"></b>').join('');
 return wrap(t,'<div class="story A" style="'+vars(t.s)+'"><div class="beam"></div><div class="halo"></div><div class="border"></div>'+
 '<div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>'+
 '<img class="logo" src="'+LOGO+'" alt="KOCHIVO"><div class="ribbon"><i></i>رتبة جديدة<i></i></div>'+
 '<div class="medal">'+emblem(d.r,'a'+i,{})+'</div><div class="floor"></div><div class="refl"><div>'+emblem(d.r,'ar'+i,{})+'</div></div>'+
 '<div class="tier">'+t.n+'</div><div class="name">'+NAME+'</div>'+
 '<div class="ladder">'+ladder+'</div><div class="step">الرتبة '+(d.r+1)+' من 7</div>'+
 '<div class="plaque"><div><b>'+d.pts+'</b><span>نقطة</span></div><div><b>'+d.w+'</b><span>تمرين</span></div></div>'+
 '<div class="foot"><p>مع الكابتن <bdi>'+CAP+'</bdi></p><small>KOCHIVO.SITE</small></div><div class="grain"></div></div>');}).join('');
document.getElementById('B').innerHTML=demo.map((d,i)=>{const t=T[d.r];
 return wrap(t,'<div class="story B" style="'+vars(t.s)+'"><div class="ghost">'+t.n+'</div><div class="wash"></div>'+
 '<div class="band"><span>COACH BETTER<span>/</span>KOCHIVO<span>/</span>COACH BETTER</span></div>'+
 '<div class="medal">'+emblem(d.r,'b'+i,{})+'</div>'+
 '<div class="top"><img class="logo" src="'+LOGO+'" alt="KOCHIVO"><span class="num">'+(d.r+1)+' / 7</span></div>'+
 '<div class="text"><div class="lab">وصل لرتبة</div><div class="tier">'+t.n+'</div><div class="name">'+NAME+'</div>'+
 '<div class="stats"><div><b>'+d.pts+'</b><span>نقطة</span></div><div><b>'+d.w+'</b><span>تمرين</span></div><div class="cap2"><b><bdi>'+CAP+'</bdi></b><span>الكابتن</span></div></div>'+
 '<div class="url"><span>خطوتك الجاية بتبدأ من هنا</span><small>KOCHIVO.SITE</small></div></div><div class="grain"></div></div>');}).join('');
</script></body></html>
