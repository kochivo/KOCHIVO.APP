<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KOCHIVO Demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700&family=Changa:wght@600;700;800&family=Manrope:wght@500;700;800&display=swap">
<style>
/* The demo is the product itself: the captain workspace and the player's phone, both live and wired to each other. One guide card walks the day; everything stays clickable. */
:root{
  --bg:#0b0c0d;--deep:#070808;--ink:#f4f4f1;--mut:#a6abb0;--dim:#6f7479;--line:rgb(255 255 255/.08);--line2:rgb(255 255 255/.13);
  --lime:#b6e94f;--lime-a:rgb(182 233 79/.13);--on:#0e1206;--warn:#ff9a73;--warn-a:rgb(255 154 115/.13);--calm:#9db2ff;--calm-a:rgb(157 178 255/.13);--gold:#e2c069;
  --f-d:"Changa","Alexandria",system-ui,sans-serif;--f-b:"Alexandria",system-ui,sans-serif;--f-n:"Manrope","Alexandria",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;background:var(--deep);color:var(--ink);font:400 14px/1.65 var(--f-b);-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:clip}
a{color:inherit;text-decoration:none}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px;border-radius:8px}
h1,h2,h3,h4,h5,p{margin:0}
.n{font-family:var(--f-n);font-variant-numeric:tabular-nums}
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* liquid glass, from the v11 workspace */
.glass{background:linear-gradient(160deg,rgb(255 255 255/.075),rgb(255 255 255/.025) 45%,rgb(255 255 255/.04));border:1px solid rgb(255 255 255/.07);box-shadow:inset 0 1px 0 rgb(255 255 255/.14),inset 0 -1px 0 rgb(0 0 0/.25),0 1px 2px rgb(0 0 0/.4),0 18px 40px -18px rgb(0 0 0/.85);border-radius:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:12px;font-weight:600;font-size:13px;white-space:nowrap;transition:transform .15s,filter .15s}
.btn:active{transform:scale(.97)}
.btn.go{background:linear-gradient(180deg,#cdf56f,#a9e03c);color:var(--on);box-shadow:inset 0 1px 0 rgb(255 255 255/.55),inset 0 -2px 0 rgb(0 0 0/.12),0 6px 20px -4px rgb(182 233 79/.45)}
.btn.go:hover{filter:brightness(1.06)}
.btn.gl{background:linear-gradient(180deg,rgb(255 255 255/.09),rgb(255 255 255/.04));border:1px solid var(--line2);box-shadow:inset 0 1px 0 rgb(255 255 255/.1)}
.btn.gl:hover{background:rgb(255 255 255/.1)}
.btn.sm{min-height:32px;padding:0 12px;font-size:12px;border-radius:10px}
.btn.lg{min-height:48px;padding:0 22px;font-size:14px;border-radius:14px}
.btn[disabled]{opacity:.4;pointer-events:none}

/* top bar */
.top{position:sticky;top:0;z-index:60;background:rgb(7 8 8/.94);border-bottom:1px solid var(--line)}
.top .in{max-width:1480px;margin:auto;padding:0 20px;height:64px;display:flex;align-items:center;gap:14px}
.top img{height:24px;display:block}
.tag{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:99px;border:1px solid var(--line2);font-size:12px;color:var(--mut)}
.tag i{width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 3px var(--lime-a)}
.top .sp{flex:1}
.seg{display:none;padding:3px;border-radius:13px;background:rgb(255 255 255/.04);border:1px solid var(--line)}
.seg button{height:36px;padding:0 14px;border-radius:10px;color:var(--mut);font-size:12.5px;display:inline-flex;gap:6px;align-items:center}
.seg button[aria-pressed=true]{background:rgb(255 255 255/.1);color:var(--ink);box-shadow:inset 0 1px 0 rgb(255 255 255/.1)}

/* stage */
.stage{max-width:1480px;margin:auto;padding:20px;display:grid;grid-template-columns:minmax(0,1fr) 318px;gap:20px;align-items:start}
.lbl{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);margin-bottom:10px}
.lbl b{color:var(--mut);font-weight:500}
.phonecol{position:sticky;top:84px}

/* captain app */
.app{position:relative;isolation:isolate;overflow:hidden;border-radius:24px;border:1px solid var(--line2);background:var(--bg);display:grid;grid-template-columns:212px minmax(0,1fr);height:calc(100vh - 124px);min-height:640px;container-type:inline-size}
.orbs{position:absolute;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.orbs i{position:absolute;border-radius:50%;filter:blur(60px)}
.orbs i:nth-child(1){width:46%;aspect-ratio:1;background:radial-gradient(circle,#b6e94f,transparent 68%);top:-28%;inset-inline-start:24%;opacity:.22}
.orbs i:nth-child(2){width:40%;aspect-ratio:1;background:radial-gradient(circle,#4f7cff,transparent 68%);bottom:-30%;inset-inline-end:-8%;opacity:.2}
.orbs i:nth-child(3){width:30%;aspect-ratio:1;background:radial-gradient(circle,#2fd4a7,transparent 70%);top:45%;inset-inline-start:-10%;opacity:.12}
.orbs b{position:absolute;inset:0;background-image:linear-gradient(rgb(255 255 255/.022) 1px,transparent 1px),linear-gradient(90deg,rgb(255 255 255/.022) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse at 60% 15%,#000,transparent 75%);mask-image:radial-gradient(ellipse at 60% 15%,#000,transparent 75%)}
.side{margin:12px;padding:14px 10px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.side img{height:20px;width:auto;align-self:flex-start;margin:2px 10px 16px}
.side small{color:var(--dim);font-size:11px;padding:10px 10px 4px}
.nav{display:flex;align-items:center;gap:10px;min-height:42px;padding:0 10px;border-radius:12px;color:var(--mut);font-size:13px;text-align:start;width:100%}
.nav:hover{background:rgb(255 255 255/.05);color:var(--ink)}
.nav[aria-current=page]{background:var(--lime-a);color:var(--lime);box-shadow:inset 0 0 0 1px rgb(182 233 79/.18)}
.nav b{margin-inline-start:auto;font:700 11px var(--f-n);background:rgb(255 255 255/.1);border-radius:99px;padding:0 8px;color:var(--ink)}
.nav b.hot{background:var(--lime);color:var(--on)}
.who{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:rgb(0 0 0/.2)}
.who b{display:block;font-size:12.5px}.who small{padding:0;font-size:11px}
.main{display:flex;flex-direction:column;gap:12px;padding:12px 12px 12px 4px;min-width:0;overflow:auto;scrollbar-width:thin;scrollbar-color:rgb(255 255 255/.1) transparent}
.bar{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 14px;position:sticky;top:0;z-index:5;background:linear-gradient(160deg,rgb(30 33 35/.96),rgb(20 22 24/.96))}
.bar h2{font-size:16px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar h2 small{display:block;font-size:11.5px;color:var(--mut);font-weight:400}
.srch{display:flex;align-items:center;gap:8px;height:38px;width:220px;padding:0 12px;border-radius:99px;border:1px solid var(--line);color:var(--dim);font-size:12px}
.icb{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line);color:var(--mut);position:relative}
.icb .dot{position:absolute;top:8px;inset-inline-end:9px;width:7px;height:7px;border-radius:50%;background:var(--lime)}

.pn{padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.pn>h4{font-size:14px;display:flex;align-items:center;gap:8px;margin-bottom:2px}
.pn>h4 em{font-style:normal;margin-inline-start:auto;font:600 11.5px var(--f-b);color:var(--mut)}
.row{display:flex;align-items:center;gap:10px;min-height:54px;padding:7px 10px;border-radius:13px;background:rgb(0 0 0/.22);border:1px solid rgb(255 255 255/.04)}
.row>div{min-width:0;flex:1}
.row b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small{display:block;font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button.row{width:100%;text-align:start}button.row:hover{background:rgb(255 255 255/.05)}
.av{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:11.5px;font-weight:700;flex:none;background:rgb(255 255 255/.08)}
.av.c{background:var(--calm-a);color:var(--calm)}.av.w{background:var(--warn-a);color:var(--warn)}.av.l{background:var(--lime-a);color:var(--lime)}.av.g{background:rgb(226 192 105/.13);color:var(--gold)}
.ch{font-size:11px;padding:3px 10px;border-radius:99px;white-space:nowrap;font-weight:500}
.ch.w{background:var(--warn-a);color:var(--warn)}.ch.c{background:var(--calm-a);color:var(--calm)}.ch.l{background:var(--lime-a);color:var(--lime)}.ch.m{background:rgb(255 255 255/.07);color:var(--mut)}
.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.hero{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:20px;align-items:center;padding:16px 18px}
.hero .t b{font-size:17px;display:block}.hero .t small{color:var(--mut);font-size:12px}
.kp{display:grid;grid-template-columns:repeat(3,minmax(104px,1fr));gap:8px}
.kp button,.kp div{padding:9px 12px;border-radius:12px;background:rgb(0 0 0/.26);border:1px solid rgb(255 255 255/.05);text-align:start}
.kp button:hover{border-color:var(--line2)}
.kp span{display:block;font-size:11px;color:var(--mut)}
.kp strong{font:800 22px/1.3 var(--f-n)}
.kp .l strong{color:var(--lime)}.kp .w strong{color:var(--warn)}
.feed{display:flex;flex-direction:column;gap:6px}
.fi{display:flex;gap:10px;align-items:flex-start;padding:8px 4px;border-bottom:1px solid var(--line)}
.fi:last-child{border:0}
.fi .d{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:none}
.fi b{font-size:12.5px;font-weight:600;display:block}.fi small{font-size:11px;color:var(--mut)}
.fi time{margin-inline-start:auto;font:500 11px var(--f-n);color:var(--dim);white-space:nowrap}
.fi.new{animation:pop .5s}
@keyframes pop{from{background:var(--lime-a)}to{background:transparent}}
.empty{display:grid;place-items:center;text-align:center;gap:6px;padding:26px 10px;color:var(--mut);font-size:12.5px;border:1px dashed var(--line2);border-radius:14px}
.empty b{color:var(--ink);font-size:13.5px}

/* chat */
.inbox{display:grid;grid-template-columns:250px minmax(0,1fr);gap:12px;flex:1;min-height:520px}
.thread{display:flex;flex-direction:column;gap:8px;padding:14px;min-height:0}
.msgs{flex:1;display:flex;flex-direction:column;gap:8px;overflow:auto;padding:4px}
.msg{max-width:78%;padding:9px 13px;border-radius:15px;font-size:13px;line-height:1.6}
.msg.t{background:rgb(255 255 255/.07);align-self:flex-start;border-end-start-radius:4px}
.msg.me{background:linear-gradient(180deg,#cdf56f,#a9e03c);color:var(--on);align-self:flex-end;border-end-end-radius:4px}
.msg small{display:block;font:500 10px var(--f-n);opacity:.6;margin-top:2px}
.voice{display:flex;align-items:center;gap:8px}.wv{display:flex;gap:2px;align-items:center}.wv i{width:2.5px;border-radius:2px;background:currentColor;opacity:.7}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{height:30px;padding:0 12px;border-radius:99px;border:1px solid var(--line2);font-size:11.5px;color:var(--mut)}
.quick button:hover{color:var(--ink);border-color:rgb(182 233 79/.4)}
.cmp{display:flex;gap:8px;align-items:center}
.cmp input{flex:1;height:44px;border-radius:99px;border:1px solid var(--line2);background:rgb(0 0 0/.25);padding:0 16px;font-size:13px;min-width:0}
.cmp input::placeholder{color:var(--dim)}
.send{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,#cdf56f,#a9e03c);color:var(--on);flex:none;box-shadow:inset 0 1px 0 rgb(255 255 255/.5)}

/* assessment */
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ph{aspect-ratio:3/4;border-radius:14px;background:radial-gradient(60% 45% at 50% 38%,rgb(255 255 255/.13),transparent 70%),linear-gradient(180deg,#1b1e21,#111315);position:relative;overflow:hidden;border:1px solid var(--line)}
.ph::after{content:"";position:absolute;left:50%;bottom:-8%;transform:translateX(-50%);width:44%;height:72%;border-radius:45% 45% 20% 20%;background:linear-gradient(180deg,rgb(255 255 255/.12),rgb(255 255 255/.04))}
.ph::before{content:"";position:absolute;left:50%;top:14%;transform:translateX(-50%);width:20%;aspect-ratio:1;border-radius:50%;background:rgb(255 255 255/.12)}
.ph span{position:absolute;bottom:8px;inset-inline-start:8px;z-index:1;font-size:11px;background:rgb(0 0 0/.55);padding:2px 9px;border-radius:99px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{color:var(--dim);font-weight:500;text-align:start;padding:6px 8px;font-size:11.5px}
td{padding:9px 8px;border-top:1px solid var(--line)}
td.d{font-family:var(--f-n);font-weight:700}
.up{color:var(--warn)}.dn{color:var(--lime)}
textarea{width:100%;min-height:76px;resize:vertical;border-radius:14px;border:1px solid var(--line2);background:rgb(0 0 0/.25);padding:12px 14px;font-size:13px;line-height:1.6}
.done-banner{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--lime-a);color:var(--lime);font-weight:600;font-size:13px}

/* player file */
.pf{display:flex;align-items:center;gap:14px;padding:16px 18px}
.pf .av{width:56px;height:56px;border-radius:18px;font-size:17px}
.pf h3{font-size:18px}.pf small{color:var(--mut);font-size:12px}
.tabs{display:flex;gap:4px;padding:4px;border-radius:13px;background:rgb(0 0 0/.25);border:1px solid var(--line);width:max-content;max-width:100%;overflow:auto}
.tabs button{height:34px;padding:0 14px;border-radius:10px;font-size:12.5px;color:var(--mut);white-space:nowrap}
.tabs button[aria-pressed=true]{background:rgb(255 255 255/.09);color:var(--ink)}
.stat{padding:12px 14px;border-radius:14px;background:rgb(0 0 0/.24);border:1px solid rgb(255 255 255/.05)}
.stat span{display:block;font-size:11.5px;color:var(--mut)}.stat strong{font:800 22px var(--f-n)}
.chart svg{width:100%;height:auto;display:block}

/* program */
.ex{display:grid;grid-template-columns:28px minmax(0,1fr) auto auto;gap:10px;align-items:center;min-height:56px;padding:8px 12px;border-radius:13px;background:rgb(0 0 0/.22);border:1px solid rgb(255 255 255/.04)}
.ex .k{font:700 12px var(--f-n);color:var(--dim)}
.ex b{font-size:13px;display:block}.ex small{color:var(--mut);font-size:11.5px}
.ex .sr{font:700 13px var(--f-n);direction:ltr}
.ex.new{border-color:rgb(182 233 79/.5);background:var(--lime-a)}
.lib{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:16px;border:1px solid rgb(182 233 79/.3);background:rgb(0 0 0/.3)}
.lib input{height:42px;border-radius:12px;border:1px solid var(--line2);background:rgb(0 0 0/.3);padding:0 14px;font-size:13px}
.lib .li{display:flex;align-items:center;gap:10px;min-height:46px;padding:0 10px;border-radius:11px;text-align:start;width:100%}
.lib .li:hover{background:rgb(255 255 255/.05)}
.lib .li .th{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,rgb(255 255 255/.1),rgb(0 0 0/.3));display:grid;place-items:center;color:var(--dim)}
.lib .li em{font-style:normal;margin-inline-start:auto;color:var(--dim);font-size:11.5px}

/* food */
.mac{display:flex;flex-direction:column;gap:10px}
.mac .mr{display:grid;grid-template-columns:70px 1fr 74px;gap:10px;align-items:center;font-size:12.5px}
.mac .tr{height:8px;border-radius:99px;background:rgb(255 255 255/.07);overflow:hidden}.mac .tr i{display:block;height:100%;border-radius:99px}
.mac .mr span:last-child{font:700 12px var(--f-n);text-align:end;direction:ltr}
.meal{display:flex;flex-direction:column;gap:6px}
.meal h5{font-size:13px;display:flex;gap:8px;align-items:center}.meal h5 em{font-style:normal;margin-inline-start:auto;color:var(--mut);font:600 11.5px var(--f-n)}
.fd{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-radius:12px;background:rgb(0 0 0/.22);font-size:13px}
.fd b{font:700 12.5px var(--f-n);margin-inline-start:auto}
.fd.sw{border:1px solid rgb(182 233 79/.35)}

/* money */
.big{font:800 40px/1 var(--f-n)}.big small{font:500 13px var(--f-b);color:var(--mut)}
.meter{height:10px;border-radius:99px;background:rgb(255 255 255/.07);overflow:hidden;display:flex}.meter i{display:block;height:100%;transition:width .5s}
.amt{font:700 14px var(--f-n)}

/* add player */
.form{display:flex;flex-direction:column;gap:14px}
.fl{display:flex;flex-direction:column;gap:6px}.fl>span{font-size:12px;color:var(--mut)}
.fl input{height:46px;border-radius:13px;border:1px solid var(--line2);background:rgb(0 0 0/.25);padding:0 14px;font-size:14px}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.opt{padding:12px;border-radius:14px;border:1px solid var(--line2);text-align:start;background:rgb(0 0 0/.2)}
.opt b{display:block;font-size:13px}.opt small{color:var(--mut);font-size:11.5px}
.opt[aria-pressed=true]{border-color:rgb(182 233 79/.6);background:var(--lime-a)}
.tg{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 12px;border-radius:13px;background:rgb(0 0 0/.22);text-align:start;width:100%}
.tg>span:first-child{flex:1}.tg small{display:block;color:var(--mut);font-size:11.5px}
.sw{width:42px;height:24px;border-radius:99px;background:rgb(255 255 255/.14);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:inset-inline-start .2s}
.tg[aria-pressed=true] .sw{background:var(--lime)}.tg[aria-pressed=true] .sw::after{inset-inline-start:21px;background:var(--on)}
.link{display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border-radius:13px;background:rgb(0 0 0/.35);border:1px solid var(--line2);font:600 13px var(--f-n);direction:ltr;justify-content:space-between}

/* phone */
.phone{width:300px;height:620px;border-radius:50px;padding:10px;margin:auto;background:linear-gradient(145deg,#4b5056,#1c1f23 40%,#2c3035 70%,#141619);box-shadow:inset 0 1px 1px rgb(255 255 255/.25),0 0 0 1px rgb(0 0 0/.7),0 50px 90px -30px #000}
.scr{position:relative;height:100%;border-radius:41px;overflow:hidden;background:radial-gradient(90% 40% at 70% 0,rgb(182 233 79/.13),transparent 70%),radial-gradient(80% 35% at 0 100%,rgb(157 178 255/.09),transparent 70%),#0a0b0c;display:flex;flex-direction:column}
.sb{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font:700 12px var(--f-n);direction:ltr}
.sb::after{content:"";position:absolute;top:11px;left:50%;transform:translateX(-50%);width:92px;height:26px;border-radius:99px;background:#000}
.pbody{flex:1;overflow:auto;padding:4px 14px 12px;display:flex;flex-direction:column;gap:10px;scrollbar-width:none}
.pbody::-webkit-scrollbar{display:none}
.ph-h{display:flex;align-items:flex-end;gap:8px}
.ph-h small{display:block;color:var(--mut);font-size:11px}.ph-h b{font-size:17px}
.ph-h .off{margin-inline-start:auto;font-size:10px;color:var(--lime);border:1px solid rgb(182 233 79/.35);border-radius:99px;padding:1px 8px;white-space:nowrap}
.pc{padding:12px;display:flex;flex-direction:column;gap:7px;border-radius:18px}
.pc h5{font-size:14px;display:flex;align-items:center;gap:6px}.pc h5 em{font-style:normal;margin-inline-start:auto;font:600 11px var(--f-n);color:var(--mut)}
.vid{height:96px;border-radius:13px;background:radial-gradient(50% 70% at 50% 40%,rgb(182 233 79/.12),transparent),linear-gradient(135deg,#1c1f22,#0d0e10);display:grid;place-items:center;color:var(--ink)}
.vid span{width:40px;height:40px;border-radius:50%;background:rgb(255 255 255/.12);display:grid;place-items:center}
.st{display:flex;align-items:center;gap:8px;min-height:36px;padding:0 10px;border-radius:11px;background:rgb(0 0 0/.3);font-size:12.5px}
.st .k{color:var(--dim);width:14px;font-family:var(--f-n)}.st b{font-family:var(--f-n)}.st .ok{margin-inline-start:auto;color:var(--lime)}
.st.new{animation:pop .6s}
.stps{display:grid;grid-template-columns:1fr 1fr;gap:8px}

 x=Math.max(m,Math.min(innerWidth-gw-m,x));y=Math.max(80,Math.min(innerHeight-gh-m,y));g.style.left=x+'px';g.style.top=y+'px';}
