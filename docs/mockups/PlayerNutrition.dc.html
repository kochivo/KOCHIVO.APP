<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>التغذية اليومية</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300..900&amp;family=Changa:wght@500..800&amp;family=Manrope:wght@500;700;800&amp;display=swap">
<style>
body{margin:0;background:#0B0E11}
h1,h2,h3,button,.cta,.go,.display{font-family:Manrope,Changa,Alexandria,sans-serif}
button{font-family:inherit;cursor:pointer}
a{color:#B6E94F}a:hover{color:#d3f58f}
.mesh{background:radial-gradient(32rem 22rem at 105% -5%,rgba(182,233,79,.10),transparent 60%),radial-gradient(30rem 30rem at -15% 30%,#17222e,transparent 65%),radial-gradient(26rem 24rem at 80% 110%,#131c25,transparent 70%),#0B0E11}
.glass{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.10);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.glass-strong{background:rgba(0,0,0,.40);border:1px solid rgba(255,255,255,.10);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
.navbar{background:rgba(16,20,24,.72);border:1px solid rgba(255,255,255,.10);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 18px 40px -12px rgba(0,0,0,.7)}
</style>
</helmet>
<div dir="rtl" class="mesh" style="width: 390px; height: 844px; box-sizing: border-box; color: #F2F2EE; font-family: Manrope, Alexandria, sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 14px; padding: 22px 20px 110px; overflow: hidden">
    <div style="display: flex; align-items: flex-end; justify-content: space-between">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 11px; letter-spacing: 0.14em; color: #9AA0A6">TUESDAY · 3 NOV</span>
        <h1 style="margin: 0; font-size: 26px; font-weight: 800">أكل النهارده</h1>
      </div>
      <span style="font-size: 12px; color: #9AA0A6">تضخيم نضيف</span>
    </div>

    <div class="glass-strong" style="border-radius: 28px; padding: 18px; display: flex; align-items: center; gap: 18px">
      <div style="position: relative; width: 116px; height: 116px; flex-shrink: 0">
        <svg width="116" height="116" viewBox="0 0 116 116" aria-hidden="true" style="transform: rotate(-90deg)">
          <circle cx="58" cy="58" r="50" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="9"></circle>
          <circle cx="58" cy="58" r="50" fill="none" stroke="#B6E94F" stroke-width="9" stroke-linecap="round" stroke-dasharray="{{ kcal.dash }}"></circle>
        </svg>
        <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
          <span style="font-size: 26px; font-weight: 800; letter-spacing: -1px">{{ kcal.eaten }}</span>
          <span style="font-size: 10px; letter-spacing: 0.1em; color: #9AA0A6">/ {{ kcal.target }} KCAL</span>
        </div>
      </div>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 12px">
        <sc-for list="{{ macros }}" as="m" hint-placeholder-count="3">
          <div style="display: flex; flex-direction: column; gap: 5px">
            <div style="display: flex; justify-content: space-between; font-size: 12px">
              <span style="font-weight: 700">{{ m.label }}</span>
              <span style="color: #9AA0A6">{{ m.eaten }}/{{ m.target }}ج</span>
            </div>
            <svg width="100%" height="6" viewBox="0 0 100 6" preserveAspectRatio="none" aria-hidden="true">
              <rect x="0" y="0" width="100" height="6" rx="3" fill="rgba(255,255,255,.08)"></rect>
              <rect x="{{ m.x }}" y="0" width="{{ m.pct }}" height="6" rx="3" fill="#B6E94F"></rect>
            </svg>
          </div>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{ meals }}" as="meal" hint-placeholder-count="4">
        <div class="glass" style="display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 22px">
          <sc-if value="{{ meal.hasImg }}" hint-placeholder-val="{{ true }}">
            <img src="{{ meal.img }}" alt="" style="width: 60px; height: 60px; flex-shrink: 0; border-radius: 16px; object-fit: cover">
          </sc-if>
          <sc-if value="{{ meal.noImg }}" hint-placeholder-val="{{ false }}">
            <div style="width: 60px; height: 60px; flex-shrink: 0; border-radius: 16px; background: rgba(255,255,255,.06); display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800; color: #9AA0A6">{{ meal.initial }}</div>
          </sc-if>
          <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
            <span style="font-size: 11px; letter-spacing: 0.06em; color: #9AA0A6">{{ meal.name }}</span>
            <span style="font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ meal.food }}</span>
            <span style="font-size: 11px; color: #9AA0A6">P {{ meal.p }} · C {{ meal.c }} · F {{ meal.f }}</span>
          </div>
          <button onClick="{{ meal.swap }}" aria-label="بدّل ببديل مسموح" style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 16px; border: 1px solid rgba(255,255,255,.10); background: rgba(255,255,255,.06); color: #F2F2EE; display: flex; align-items: center; justify-content: center">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 0 1-15.5 6.2M3 12a9 9 0 0 1 15.5-6.2"></path><path d="M18 2v4h-4M6 22v-4h4"></path></svg>
          </button>
          <sc-if value="{{ meal.done }}" hint-placeholder-val="{{ false }}">
            <button onClick="{{ meal.toggle }}" aria-label="إلغاء إتمام الوجبة" style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 16px; border: none; background: #B6E94F; color: #101418; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px -8px rgba(182,233,79,.6)">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>
            </button>
          </sc-if>
          <sc-if value="{{ meal.open }}" hint-placeholder-val="{{ true }}">
            <button onClick="{{ meal.toggle }}" aria-label="تمّت الوجبة" style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 16px; border: 1.5px dashed rgba(255,255,255,.28); background: transparent"></button>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </div>

  <nav aria-label="التنقل" class="navbar" style="position: absolute; left: 16px; right: 16px; bottom: 18px; height: 72px; border-radius: 26px; display: flex; justify-content: space-around; align-items: center">
    <a href="PlayerHome.dc.html" style="width: 72px; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #9AA0A6; text-decoration: none; font-size: 11px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9H15v-6H9v6H3z"></path></svg>الرئيسية</a>
    <a href="PlayerNutrition.dc.html" aria-current="page" style="width: 72px; height: 56px; border-radius: 18px; background: rgba(182,233,79,.14); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #B6E94F; text-decoration: none; font-size: 11px; font-weight: 700">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M12 4v8l5 3"></path></svg>التغذية</a>
    <a href="PlayerProgress.dc.html" style="width: 72px; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #9AA0A6; text-decoration: none; font-size: 11px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"></path><path d="M15 7h6v6"></path></svg>التطور</a>
    <a href="#" style="width: 72px; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #9AA0A6; text-decoration: none; font-size: 11px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg>الكابتن</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const oats = '/_blob/90f6af83ca4aae30a6a557e6a9275491', eggs = '/_blob/18bc2d71b52e8705890787ae83371591';
    const chicken = '/_blob/ef1025f9bd9fb5d7bfe4266664151e15', rice = '/_blob/d9a80955bbec8e4aa11dd2a7fd39d371';
    this.meals = [
      { name: 'الفطار', opts: [['شوفان 80ج + 3 بيضات', 27, 54, 16, oats], ['4 بيضات + 2 توست أسمر', 28, 30, 20, eggs], ['فول 200ج + عيش بلدي', 24, 60, 6, null]] },
      { name: 'الغدا', opts: [['فراخ 200ج + رز 250ج', 61, 70, 7, chicken], ['رز 250ج + بلطي 250ج', 56, 72, 6, rice], ['لحمة 180ج + مكرونة 220ج', 52, 68, 18, null]] },
      { name: 'سناك', opts: [['زبادي يوناني + موزة', 20, 30, 3, null], ['سكوب واي + تفاحة', 26, 25, 2, null]] },
      { name: 'العشا', opts: [['تونة علبة + 2 توست أسمر', 32, 30, 6, null], ['4 بيضات + سلطة', 26, 8, 20, eggs]] }
    ];
    this.state = { pick: [0, 0, 0, 0], done: [true, false, false, false] };
  }
  renderVals() {
    const s = this.state;
    const tP = 180, tC = 250, tF = 70;
    let eP = 0, eC = 0, eF = 0;
    const meals = this.meals.map((m, i) => {
      const o = m.opts[s.pick[i]];
      if (s.done[i]) { eP += o[1]; eC += o[2]; eF += o[3]; }
      return {
        name: m.name, food: o[0], p: o[1], c: o[2], f: o[3], img: o[4] || '', hasImg: !!o[4], noImg: !o[4], initial: o[0].charAt(0),
        done: s.done[i], open: !s.done[i],
        toggle: () => { const d = s.done.slice(); d[i] = !d[i]; this.setState({ done: d }); },
        swap: () => { const p = s.pick.slice(); p[i] = (p[i] + 1) % m.opts.length; this.setState({ pick: p }); }
      };
    });
    const bar = (label, e, t) => { const pct = Math.min(100, Math.round(e / t * 100)); return { label, eaten: e, target: t, pct, x: 100 - pct }; };
    const kT = tP * 4 + tC * 4 + tF * 9, kE = eP * 4 + eC * 4 + eF * 9, circ = 2 * Math.PI * 50;
    return {
      meals,
      macros: [bar('بروتين', eP, tP), bar('كارب', eC, tC), bar('دهون', eF, tF)],
      kcal: { eaten: kE, target: kT, dash: (Math.min(1, kE / kT) * circ).toFixed(1) + ' ' + circ.toFixed(1) }
    };
  }
}
</script>
</body>
</html>
