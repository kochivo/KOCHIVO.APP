<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KO strip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700&family=Changa:wght@600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0b0d0a; --ink:#f3f2ec; --muted:#9a9c94; --lime:#c8f550; --on-lime:#10140a; --line:rgba(255,255,255,.08); }
  * { box-sizing:border-box; margin:0; }
  body { background:radial-gradient(120% 60% at 80% 0%, #1d2610 0%, var(--bg) 55%); color:var(--ink); font-family:'Manrope','Alexandria',system-ui,sans-serif; padding:16px; min-height:100vh; }
  h1 { font:700 13px 'Alexandria'; color:var(--muted); margin:6px 4px 10px; }
  .glass { background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02)); border:1px solid var(--line); border-radius:24px; backdrop-filter:blur(12px); }
  .hero { padding:16px; text-align:start; }
  .lead { font:500 15px/1.9 'Alexandria'; }
  .num { font:800 64px/1 'Manrope'; text-align:center; letter-spacing:-.04em; margin-top:14px; }
  .cap { text-align:center; color:var(--muted); font:500 13px 'Alexandria'; margin-top:6px; }
  /* old */
  .old-tag { display:inline-flex; background:var(--lime); color:var(--on-lime); border-radius:999px; padding:8px 14px; font:800 15px 'Changa'; box-shadow:0 0 18px rgba(200,245,80,.3); margin-bottom:10px; }
  /* new */
  .strip { display:inline-flex; align-items:center; gap:6px; height:30px; padding-inline:3px 12px; border-radius:999px; background:rgba(200,245,80,.10); border:1px solid rgba(200,245,80,.28); margin-bottom:10px; }
  .strip img { width:24px; height:24px; border-radius:999px; background:#1a2208; object-fit:contain; }
  .strip b { font:800 11px 'Manrope'; color:var(--lime); letter-spacing:.02em; }
  .strip span { font:600 11.5px 'Alexandria'; color:var(--ink); opacity:.85; }
  .strip i { width:3px; height:3px; border-radius:9px; background:var(--muted); }
  .gap { height:22px; }
  .note { font:400 12px/1.7 'Alexandria'; color:var(--muted); margin:8px 6px 0; }
</style>
</head>
<body>
  <h1>دلوقتي</h1>
  <section class="glass hero">
    <span class="old-tag">KO · ملخص الصبح</span>
    <p class="lead">خلصت كل مهام النهارده. فريقك ماشي تمام.</p>
    <div class="num">0</div><p class="cap">مهام النهارده</p>
  </section>

  <div class="gap"></div>
  <h1>الجديد</h1>
  <section class="glass hero">
    <span class="strip"><img src="../../../public/ko-preview/welcome.png" alt=""><b>KO</b><i></i><span>ملخص الصبح</span></span>
    <p class="lead">خلصت كل مهام النهارده. فريقك ماشي تمام.</p>
    <div class="num">0</div><p class="cap">مهام النهارده</p>
  </section>
  <p class="note">لوجو KO الحقيقي (نفس وش KO اللي في الزرار) جوه شريط صغير 30px، شفاف بلمسة lime بدل الكبسولة الليمونى الكبيرة.</p>
</body>
</html>
