<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KOCHIVO — نموذج الكابتن v11</title>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0c0d;--deep:#070808;--ink:#f4f4f1;--muted:#a6abb0;--dim:#6f7479;--line:rgb(255 255 255/.08);--lime:#b6e94f;--lime-soft:rgb(182 233 79/.12);--warn:#ff9a73;--warn-soft:rgb(255 154 115/.12);--calm:#9db2ff;--calm-soft:rgb(157 178 255/.12);--gold:#e2c069;--g:rgb(255 255 255/.04);--g2:rgb(255 255 255/.065);--hl:rgb(255 255 255/.08);--sh:inset 0 1px 0 var(--hl),0 8px 30px -12px rgb(0 0 0/.7)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Alexandria,sans-serif;background:#050606;color:var(--ink);font-size:13px;padding:18px 20px 40px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.n{font-family:Manrope;unicode-bidi:isolate;direction:ltr;display:inline-block;font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.s{width:15px;height:15px}
.top{max-width:1400px;margin:0 auto 14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top h1{font-size:18px;font-weight:700}
.top p{color:var(--muted);font-size:12.5px}
.mode{margin-inline-start:auto;display:flex;padding:3px;border-radius:99px;background:var(--g);border:1px solid var(--line)}
.mode button{padding:7px 16px;border-radius:99px;color:var(--muted);font-size:12.5px}
.mode button.on{background:var(--lime);color:#0e1206;font-weight:600}
.stage{max-width:1400px;margin:0 auto}
.scene{position:relative;overflow:hidden;background:radial-gradient(100% 70% at 90% -10%,#141b0b 0%,transparent 55%),radial-gradient(80% 60% at 0% 110%,#0d111b 0%,transparent 60%),linear-gradient(180deg,var(--bg),var(--deep));border:1px solid var(--line)}
.glass{background:var(--g);border:1px solid var(--line);box-shadow:var(--sh);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-radius:18px}
/* desktop */
.desk{height:calc(100vh - 90px);min-height:640px;border-radius:24px;display:grid;grid-template-columns:1fr 220px;gap:14px;padding:14px}
.side{grid-column:2;grid-row:1;padding:14px 10px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.brand{padding:4px 8px 12px}.brand img{height:20px}
.grp{font-size:10.5px;color:var(--dim);padding:12px 10px 4px}
.nav{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:10px;color:var(--muted);font-size:13px;width:100%;text-align:start}
.nav:hover{background:var(--g)}
.nav.on{background:var(--g2);color:var(--ink);box-shadow:inset 0 1px 0 var(--hl)}
.nav.on svg{color:var(--lime)}
.b{margin-inline-start:auto;min-width:20px;height:18px;padding:0 6px;border-radius:99px;background:var(--lime);color:#0e1206;font:800 10.5px Manrope;display:grid;place-items:center}
.b.s{background:var(--g2);color:var(--ink)}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:var(--g);border:1px solid var(--line)}
.me small{display:block;color:var(--muted);font-size:11px}
.content{grid-column:1;grid-row:1;overflow:auto;min-width:0;border-radius:18px;container-type:inline-size;scrollbar-width:thin;scrollbar-color:#2a2d2f transparent}
.pg{display:flex;flex-direction:column;gap:12px;padding-bottom:20px}
/* phone */
.phonewrap{display:flex;justify-content:center}
.phone{width:390px;height:calc(100vh - 90px);min-height:700px;max-height:844px;border-radius:44px;position:relative;padding:0}
.phone .content{position:absolute;inset:0;padding:16px 14px 96px;border-radius:44px}
.pnav{position:absolute;bottom:14px;inset-inline:12px;height:62px;border-radius:99px;display:flex;align-items:center;justify-content:space-around;z-index:5;background:rgb(28 31 28/.8)}
.pnav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--muted);padding:6px 9px;border-radius:99px;position:relative}
.pnav button.on{background:var(--lime-soft);color:var(--lime)}
.pnav .b{position:absolute;top:0;inset-inline-end:2px;min-width:15px;height:15px;font-size:9px;padding:0 3px}
.dimmer{position:absolute;inset:0;background:rgb(0 0 0/.5);z-index:6;border-radius:44px;display:none}
.sheet{position:absolute;inset-inline:0;bottom:0;z-index:7;padding:10px 14px 96px;border-radius:26px 26px 44px 44px;background:rgb(20 22 20/.96);backdrop-filter:blur(24px);border-top:1px solid var(--line);display:none;max-height:85%;overflow:auto}
.sheet.open,.dimmer.open{display:block}
.grab{width:38px;height:4px;border-radius:9px;background:var(--g2);margin:0 auto 6px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tiles button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:14px;background:var(--g);border:1px solid var(--line);font-size:11px;position:relative;min-height:72px}
.tiles button svg{color:var(--lime)}
.tiles .cnt{position:absolute;top:6px;inset-inline-end:8px;font:800 9.5px Manrope;color:var(--lime)}
/* shared ui */
.bar{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 8px;border-radius:14px;flex-wrap:wrap}
.bar h2{font-size:16px;font-weight:700;padding-inline-start:6px}
.muted{color:var(--muted)}.dim{color:var(--dim)}
.search{margin-inline-start:auto;display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:99px;background:var(--g);border:1px solid var(--line);color:var(--dim);font-size:12px;width:220px}
.search kbd{margin-inline-start:auto;font:600 10px Manrope;padding:2px 6px;border-radius:6px;background:var(--g2);color:var(--muted)}
.icb{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--g);border:1px solid var(--line);position:relative;flex:none}
.icb i{position:absolute;top:7px;inset-inline-end:8px;width:7px;height:7px;border-radius:50%;background:var(--lime)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border-radius:10px;font-weight:600;font-size:12.5px;white-space:nowrap}
.btn.go{background:var(--lime);color:#0e1206;box-shadow:inset 0 1px 0 rgb(255 255 255/.35),0 0 16px rgb(182 233 79/.2)}
.btn.gl{background:var(--g2);border:1px solid var(--line)}
.btn.sm{height:28px;padding:0 10px;font-size:11.5px;border-radius:8px}
.pill{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:99px;font-size:10.5px;font-weight:600;white-space:nowrap}
.w{background:var(--warn-soft);color:var(--warn)}.c{background:var(--calm-soft);color:var(--calm)}.l{background:var(--lime-soft);color:var(--lime)}.m{background:var(--g2);color:var(--muted)}
.card{padding:14px;border-radius:18px;min-width:0}
.ch{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ch b{font-size:14px;font-weight:600}
.ch .cnt{font:700 11px Manrope;color:var(--muted);padding:1px 7px;border-radius:99px;background:var(--g2)}
.ch .lnk{margin-inline-start:auto;color:var(--muted);font-size:11.5px}
.tabs{display:flex;gap:4px;padding:3px;border-radius:99px;background:rgb(0 0 0/.25);border:1px solid var(--line);width:max-content;max-width:100%;overflow:auto;scrollbar-width:none}
.tabs button{padding:5px 12px;border-radius:99px;font-size:11.5px;color:var(--muted);white-space:nowrap}
.tabs button.on{background:var(--g2);color:var(--ink);box-shadow:inset 0 1px 0 var(--hl)}
.row{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;min-height:50px;width:100%;text-align:start}
.row+.row{border-top:1px solid var(--line)}
.row.h{background:var(--g2);border-color:transparent}
button.row:hover{background:var(--g)}
.av{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;background:var(--g2);border:1px solid var(--line)}
.av.lg{width:52px;height:52px;border-radius:16px;font-size:19px;background:linear-gradient(135deg,#2b3320,#13170c);border-color:rgb(182 233 79/.25)}
.t{flex:1;min-width:0}
.t b{display:block;font-size:13px;font-weight:600}
.t small{color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.rank{font:800 9.5px Manrope;letter-spacing:.06em;color:var(--gold);padding:2px 7px;border-radius:99px;background:rgb(226 192 105/.1)}
.wk{display:flex;gap:3px}.wk i{width:10px;height:10px;border-radius:3px;background:var(--g2)}.wk i.d{background:var(--lime)}.wk i.x{background:rgb(255 154 115/.55)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.g21{display:grid;grid-template-columns:1.4fr 1fr;gap:12px}
.g12{display:grid;grid-template-columns:260px 1fr;gap:12px}
.inb{grid-template-columns:270px 1fr}
.st{display:flex;align-items:center;gap:12px;padding:12px 14px}
.st svg.r{width:44px;height:44px;flex:none}
.st b{font:800 19px Manrope;display:block;line-height:1.15}
.st small{color:var(--muted);font-size:11.5px}
.tr{margin-inline-start:auto;font:700 11px Manrope;color:var(--lime)}
.chart{display:flex;align-items:end;gap:8px;height:110px;padding:6px 4px 0}
.chart i{flex:1;border-radius:6px 6px 3px 3px;background:var(--g2)}
.chart i.d{background:linear-gradient(180deg,#c3f062,rgb(143 194 42/.75))}
.chl{display:flex;gap:8px;font-size:10px;color:var(--dim);padding:4px 4px 0}.chl span{flex:1;text-align:center}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:11px;color:var(--dim);font-weight:500;text-align:start;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);font-size:12.5px}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--g)}
.who{display:flex;align-items:center;gap:10px}.who b{font-weight:600;display:block}.who small{color:var(--muted);font-size:11px}
.kv{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:7px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border:0}.kv b{color:var(--ink);font-weight:600}
.ko{display:flex;gap:10px;align-items:start;padding:12px;border-radius:14px;background:var(--lime-soft);border:1px solid rgb(182 233 79/.2);font-size:12.5px;line-height:1.8}
.ko .dot{width:26px;height:26px;border-radius:8px;background:var(--lime);color:#0e1206;display:grid;place-items:center;font:800 10px Manrope;flex:none}
.vid{border-radius:14px;background:linear-gradient(160deg,#252a1d,#0f110c);border:1px solid var(--line);display:grid;place-items:center;aspect-ratio:16/9;position:relative}
.vid span{width:40px;height:40px;border-radius:50%;background:rgb(255 255 255/.14);display:grid;place-items:center}
.ph{border-radius:12px;background:linear-gradient(180deg,#1d2117,#0e100b);border:1px solid var(--line);position:relative;aspect-ratio:3/4;display:grid;place-items:center;color:var(--dim)}
.ph small{position:absolute;bottom:6px;inset-inline-start:8px;font-size:10.5px;color:var(--muted)}
.metric{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.metric:last-child{border:0}.metric span{flex:1;color:var(--muted);font-size:12px}.metric b{font:700 13px Manrope}
.legend div{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);margin:3px 0}
.legend i{width:8px;height:8px;border-radius:50%}.legend b{color:var(--ink);font:700 11.5px Manrope;margin-inline-start:auto}
.bub{max-width:75%;padding:10px 14px;border-radius:16px;font-size:13px;line-height:1.7}
.bub.p{background:var(--g2);border:1px solid var(--line);border-start-start-radius:5px;align-self:flex-start}
.bub.me{background:var(--lime);color:#0e1206;border-start-end-radius:5px;align-self:flex-end}
.bub small{display:block;font-size:10px;opacity:.6}
.compose{display:flex;gap:8px;align-items:center;padding:6px;border-radius:16px;background:rgb(0 0 0/.25);border:1px solid var(--line)}
.compose .f{flex:1;color:var(--dim);padding:0 8px}
.qr{display:flex;gap:6px;flex-wrap:wrap}.qr span{padding:5px 11px;border-radius:99px;background:var(--g);border:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.ex{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.ex:last-child{border:0}
.ex .gif{width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,#22261b,#101209);border:1px solid var(--line);flex:none}
.tpl .tag{font-size:10.5px;color:var(--muted);padding:2px 8px;border-radius:99px;background:var(--g2)}
.days{display:flex;gap:4px;margin:10px 0}.days span{flex:1;height:26px;border-radius:7px;background:var(--g2);display:grid;place-items:center;font-size:10px;color:var(--muted)}.days span.on{background:var(--lime-soft);color:var(--lime)}
.podium{display:flex;align-items:end;justify-content:center;gap:10px;padding-top:10px}
.podium div{flex:1;max-width:130px;border-radius:14px 14px 4px 4px;background:var(--g2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:end;gap:4px;padding:10px 6px}
.podium b{font:800 18px Manrope}
.toggle{width:36px;height:20px;border-radius:99px;background:var(--lime);position:relative;flex:none}.toggle::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:16px;height:16px;border-radius:50%;background:#0e1206}
.toggle.off{background:var(--g2)}.toggle.off::after{inset-inline-start:auto;inset-inline-end:2px;background:var(--muted)}
.empty{padding:26px;text-align:center;color:var(--muted);font-size:12.5px}
.hint{max-width:1400px;margin:10px auto 0;color:var(--dim);font-size:11.5px}
.builder{display:grid;grid-template-columns:1fr 300px;gap:12px;align-items:start}
.builder.fb{grid-template-columns:1fr 320px}
.picker{position:sticky;top:0;max-height:calc(100vh - 200px);overflow:auto}
.gif{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#22261b,#101209);border:1px solid var(--line);flex:none;display:grid;place-items:center;color:var(--dim)}
.gif.lg{width:64px;height:64px;border-radius:14px}
.gif.xl{width:100%;height:auto;aspect-ratio:4/3;border-radius:14px;margin-bottom:8px}
.exc{display:flex;gap:12px;align-items:flex-start}
.grip{color:var(--dim);cursor:grab;padding-top:4px}
.fields{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.fields label{display:flex;flex-direction:column;gap:2px;padding:6px 10px;border-radius:10px;background:rgb(0 0 0/.25);border:1px solid var(--line);font-size:10.5px;color:var(--muted);min-width:64px}
.fields label b{font-size:14px;color:var(--ink)}
.sets{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.sets span{font-size:10.5px;color:var(--dim);padding:4px 8px;border-radius:8px;background:var(--g)}
.sets b{color:var(--ink);margin-inline-start:4px}
.sum{display:flex;justify-content:space-around;padding:10px;border-radius:14px;font-size:12px;color:var(--muted)}
.qr span.onq{background:var(--lime-soft);color:var(--lime);border-color:rgb(182 233 79/.25)}
.excard{display:flex;flex-direction:column;text-align:start;gap:2px}
.excard b{font-size:13px}.excard small{font-size:11px}
.steps{padding-inline-start:18px;line-height:2;color:var(--muted);font-size:12.5px}
.macros{display:flex;gap:16px;align-items:center}
.mbar .ml{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.mbar .ml b{color:var(--ink);font-size:11.5px}
.track{height:7px;border-radius:9px;background:var(--g2);overflow:hidden;margin-top:3px}
.track i{display:block;height:100%;border-radius:9px;transition:width .35s}
.addline{display:flex;align-items:center;gap:6px;width:100%;padding:9px;margin-top:6px;border-radius:10px;border:1px dashed var(--line);color:var(--muted);font-size:12px}
.addline:hover{border-color:rgb(182 233 79/.4);color:var(--ink)}
.qtypes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.qtypes button{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px;border-radius:12px;background:var(--g);border:1px solid var(--line);font-size:11px}
.qtypes button svg{color:var(--lime)}
.mini-phone{width:280px;min-height:500px;border-radius:32px;padding:20px 16px;background:rgb(0 0 0/.35);border:1px solid var(--line);display:flex;flex-direction:column;gap:14px;position:sticky;top:0}
.prog-dots{display:flex;gap:4px}.prog-dots i{flex:1;height:4px;border-radius:9px;background:var(--g2)}.prog-dots i.on{background:var(--lime)}
.inp{padding:12px 14px;border-radius:12px;background:var(--g2);border:1px solid var(--line);font-size:18px;font-weight:700}
.inp small{font-size:12px;color:var(--muted)}
.scale{display:flex;gap:6px}.scale span{flex:1;height:44px;border-radius:12px;background:var(--g2);display:grid;place-items:center;font:700 15px Manrope}.scale span.on{background:var(--lime);color:#0e1206}
.opt{padding:11px 14px;border-radius:12px;background:var(--g2);border:1px solid var(--line);font-size:13px}.opt.on{border-color:var(--lime);background:var(--lime-soft)}
.tier{position:relative;display:flex;flex-direction:column}
.tier.feat{border:1px solid transparent;background:radial-gradient(ellipse at top,rgb(182 233 79/.09),transparent 65%) padding-box,linear-gradient(rgb(255 255 255/.05),rgb(255 255 255/.05)) padding-box,linear-gradient(225deg,rgb(182 233 79/.5),rgb(255 255 255/.06) 60%) border-box}
@container (max-width:700px){.builder,.builder.fb{grid-template-columns:1fr}.qtypes{grid-template-columns:repeat(3,1fr)}.exg{grid-template-columns:1fr 1fr}.fields label{min-width:56px}}
.asg-bg{position:fixed;inset:0;z-index:80;background:rgb(0 0 0/.55);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:20px}
.asg-bg.open{display:flex}
.asg{width:min(620px,96vw);max-height:88vh;display:flex;flex-direction:column;border-radius:24px;background:rgb(20 22 20/.97);border:1px solid var(--line);box-shadow:0 30px 80px -20px #000;animation:pgin .25s}
.asg-bg.mobile{align-items:flex-end;padding:0}
.asg-bg.mobile .asg{width:390px;max-height:86vh;border-radius:28px 28px 0 0}
.asg-h{display:flex;gap:12px;align-items:flex-start;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.asg-h>div{flex:1;min-width:0}.asg-h b{font-size:15px}
.stp{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.stp span{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--dim);padding:3px 9px 3px 4px;border-radius:99px;background:var(--g)}
.stp span i{font-style:normal;width:17px;height:17px;border-radius:50%;display:grid;place-items:center;background:var(--g2);font-size:10px}
.stp span.on{color:var(--ink);background:var(--g2)}.stp span.on i{background:var(--lime);color:#0e1206}
.stp span.done{color:var(--lime)}.stp span.done svg{width:13px;height:13px}
.asg-b{padding:14px 18px;overflow:auto;flex:1}
.asg-f{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.asg-f .btn{height:42px;padding:0 20px}
.pick{display:flex;align-items:center;gap:10px;width:100%;padding:10px;margin-bottom:6px;border-radius:14px;background:var(--g);border:1px solid var(--line);text-align:start}
.pick.on{border-color:rgb(182 233 79/.5);background:var(--lime-soft)}
.pick svg.r{width:40px;height:40px}
.fld{margin-bottom:16px}.fld>label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:7px}
.fld .ok{color:var(--lime)}.fld .bad{color:var(--warn)}
.seg2{display:flex;gap:6px}.seg2 button{flex:1;height:40px;border-radius:12px;background:var(--g);border:1px solid var(--line);font-size:12.5px}.seg2 button.on{background:var(--lime-soft);border-color:rgb(182 233 79/.5);color:var(--lime)}

planEdit:()=>{const meals=PLAN[S.dtype];const tot=meals.reduce((a,m)=>{m.f.forEach(f=>{a.k+=f.k;a.p+=f.p;a.c+=f.c;a.f+=f.f});return a},{k:0,p:0,c:0,f:0});const T={k:2600,p:180,c:290,f:75};
 const bar=(l,v,t,col)=>`<div class="mbar"><div class="ml"><span>${l}</span><b class="n">${Math.round(v)}/${t}</b></div><div class="track"><i style="width:${Math.min(100,v/t*100)}%;background:${col}"></i></div></div>`;
 return `<div class="pg"><div class="bar glass"><button class="icb" data-go="plans" aria-label="رجوع">${ic('back','i s')}</button><div class="t" style="flex:none"><b style="font-size:15px">تضخيم 2,600</b><small>4 لاعبين عليه</small></div><button class="btn go" style="margin-inline-start:auto" data-toast="اتحفظ النظام واتحدث عند 4 لاعبين">احفظ</button></div>
 <div class="tabs"><button class="${S.dtype==='train'?'on':''}" data-dtype="train">يوم تمرين</button><button class="${S.dtype==='rest'?'on':''}" data-dtype="rest">يوم راحة</button></div>
 <div class="builder">
  <div style="display:flex;flex-direction:column;gap:12px;min-width:0">
   <section class="card glass macros">${ring(Math.min(1,tot.k/T.k),'#b6e94f',96,Math.round(tot.k).toLocaleString('en'))}<div style="flex:1;display:flex;flex-direction:column;gap:8px"><small class="muted">من ${T.k.toLocaleString('en')} سعر · ${tot.k>T.k?'<span style="color:var(--warn)">زيادة</span>':'فاضل '+Math.round(T.k-tot.k)}</small>${bar('بروتين',tot.p,T.p,'#b6e94f')}${bar('كارب',tot.c,T.c,'#9db2ff')}${bar('دهون',tot.f,T.f,'#e2c069')}</div></section>

 const checks=[[PROG.length<=I.days.length,`${PROG.length} أيام في البرنامج، وهو فاضي ${I.days.length} أيام`],[mins<=I.min,`اليوم ده حوالي ${mins} دقيقة من ${I.min} عنده`],[!warn.length,warn.length?`${warn.length} تمرين ممكن يضايق إصابته`:'مفيش تمرين بيضايق إصابته في اليوم ده']];
 return `<section class="card glass ppanel"><div class="pp-h"><span class="av lg">${p.a}</span><div class="t"><b>${p.n}</b><small>${I.age} سنة · ${I.sex} · خبرة ${I.exp}</small></div><button class="lnk" data-player="${p.id}">ملفه كامل</button></div>
  <div class="pp-grid">
   <div><small>الطول</small><b class="n">${I.h}</b><i>سم</i></div><div><small>الوزن</small><b class="n">${I.w}</b><i>كجم</i></div><div><small>الهدف</small><b class="n">${I.tw}</b><i>كجم</i></div><div><small>الدهون</small><b class="n">${I.bf}</b><i>آخر قياس</i></div>
  </div>
  <div class="pp-row"><small>أيام التمرين</small><div class="pp-days">${DAYS7.map((d,i)=>`<span class="${I.days.includes(i)?'on':''}">${d}</span>`).join('')}</div><span class="muted" style="font-size:12px">${I.min} دقيقة</span></div>
  <div class="pp-row">${I.inj.length?I.inj.map(x=>`<span class="pill w">${ic('alert','i s')}${x}</span>`).join(''):'<span class="pill l">مفيش إصابات</span>'}${I.alg.map(x=>`<span class="pill c">حساسية: ${x}</span>`).join('')}<span class="muted pp-note">«${I.notes}»</span></div>
  <div class="pp-checks">${checks.map(c=>`<span class="${c[0]?'ok':'no'}">${ic(c[0]?'check':'alert','i s')}${c[1]}</span>`).join('')}</div></section>`}

function sheetHTML(){const rest=NAV.map(g=>({g:g.g,items:g.items.filter(i=>!MOB.find(m=>m[0]===i[0]))})).filter(g=>g.items.length);

function render(){const st=document.getElementById('stage');const body=SCREENS[S.screen]();
 if(S.mode==='desk'){st.innerHTML=`<div class="scene desk"><div class="orbs"><i></i><i></i><i></i><b></b><u></u></div>${sideHTML()}<main class="content">${body}</main></div>`;}

  st.innerHTML=`<div class="phonewrap"><div class="scene phone"><div class="orbs"><i></i><i></i><i></i><b></b><u></u></div><main class="content">${body}</main><div class="dimmer ${S.sheet?'open':''}" data-close></div><div class="sheet ${S.sheet?'open':''}">${sheetHTML()}</div>

 document.querySelectorAll('.content').forEach(c=>c.scrollTop=0);}
/* toast + undo */
const toastEl=document.createElement('div');toastEl.className='toast';document.body.appendChild(toastEl);let toastT,lastDone=null;
function toast(msg,undo){toastEl.innerHTML=`<span class="ok">${ic('check','i s')}</span>${msg}${undo?'<span class="undo">تراجع</span>':''}`;toastEl.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>toastEl.classList.remove('show'),2600);}
const DONE_MSG={video:p=>`اتبعت ردك على فيديو ${p.n}`,checkin:p=>`اتراجعت متابعة ${p.n}`,program:p=>`اتعمل برنامج لـ${p.n}`,absent:p=>`اتبعتت رسالة لـ${p.n}`,swap:p=>`اتوافق على تبديل ${p.n} واتعدل البرنامج`,renew:p=>`اتبعت تذكير التجديد لـ${p.n}`};
function finishTask(i,rowEl){const t=TASKS[i];const p=byId(t.p);const fin=()=>{lastDone=TASKS.splice(i,1)[0];toast(DONE_MSG[t.k](p),true);render();};if(rowEl){rowEl.classList.add('bye');setTimeout(fin,200)}else fin();}
/* command palette */
const pal=document.createElement('div');pal.className='pal-bg';pal.innerHTML=`<div class="pal"><input placeholder="دور على لاعب، صفحة، أو أمر…"><div class="list"></div><div class="foot"><span><kbd>↑↓</kbd> تنقل</span><span><kbd>Enter</kbd> افتح</span><span><kbd>Esc</kbd> اقفل</span></div></div>`;document.body.appendChild(pal);
let palIdx=0,palItems=[];
function palBuild(q=''){q=q.trim();const pages=Object.entries(TITLES).filter(([k])=>k!=='player').map(([k,v])=>({g:'الصفحات',t:v,s:'صفحة',run:()=>go(k)}));
 const ppl=P.map(p=>({g:'اللاعبين',t:p.n,s:p.goal,run:()=>go('player',{player:p.id,pTab:'over'})}));
 const cmds=[{g:'أوامر',t:'ضيف لاعب جديد',s:'أمر',run:()=>go('join')},{g:'أوامر',t:'برنامج جديد',s:'أمر',run:()=>go('programs')},{g:'أوامر',t:'ابعت رسالة للاعب',s:'أمر',run:()=>go('inbox')}];
 palItems=[...ppl,...pages,...cmds].filter(x=>!q||x.t.includes(q));palIdx=0;palDraw();}
function palDraw(){let g='';pal.querySelector('.list').innerHTML=palItems.length?palItems.map((x,i)=>{const h=x.g!==g?`<div class="grp">${x.g}</div>`:'';g=x.g;return h+`<button class="it ${i===palIdx?'on':''}" data-pi="${i}">${x.g==='اللاعبين'?`<span class="av" style="width:26px;height:26px;font-size:11px">${x.t[0]}</span>`:ic(x.g==='أوامر'?'plus':'back','i s')}${x.t}<small>${x.s}</small></button>`}).join(''):'<div class="empty">مفيش نتايج</div>';}
function palOpen(){pal.classList.add('open');const inp=pal.querySelector('input');inp.value='';palBuild();setTimeout(()=>inp.focus(),10);}
function palClose(){pal.classList.remove('open')}
pal.addEventListener('click',e=>{const it=e.target.closest('[data-pi]');if(it){palClose();palItems[+it.dataset.pi].run();return}if(e.target===pal)palClose();});
pal.querySelector('input').addEventListener('input',e=>palBuild(e.target.value));
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();pal.classList.contains('open')?palClose():palOpen();return}
 if(!pal.classList.contains('open'))return;
 if(e.key==='Escape')palClose();
 if(e.key==='ArrowDown'){palIdx=Math.min(palIdx+1,palItems.length-1);palDraw();e.preventDefault()}
 if(e.key==='ArrowUp'){palIdx=Math.max(palIdx-1,0);palDraw();e.preventDefault()}
 if(e.key==='Enter'&&palItems[palIdx]){palClose();palItems[palIdx].run()}});
toastEl.addEventListener('click',()=>{});
document.addEventListener('click',e=>{if(e.target.closest('.toast .undo')&&lastDone){TASKS.push(lastDone);lastDone=null;toastEl.classList.remove('show');render();}},true);
document.addEventListener('click',e=>{const el=e.target.closest('[data-reply],[data-pal],[data-done],[data-start],[data-go],[data-player],[data-ptab],[data-ttab],[data-sel],[data-chat],[data-chatp],[data-more],[data-close],[data-act]');if(!el)return;
 const d=el.dataset;
 if(d.pal!==undefined){palOpen();return}
 if(d.reply!==undefined){finishTask(S.sel,null);return}

function foodLive(){const box=document.getElementById('fd-chk');if(!box)return;const v=k=>+document.querySelector('[data-mac="'+k+'"]').value||0;const k=v('k'),p=v('p'),c=v('c'),f=v('f');const calc=Math.round(p*4+c*4+f*9);const ok=Math.abs(calc-k)<=k*.08;
 box.innerHTML=ok?ic('check','i s')+'السعرات مظبوطة مع الماكروز (<span class="n">'+calc+'</span> محسوبة)':ic('alert','i s')+'الماكروز بتطلع <span class="n">'+calc+'</span> سعر، وانت كاتب <span class="n">'+k+'</span>. راجع الأرقام.';box.className='note2 '+(ok?'okn':'badn');
 const tot=p*4+c*4+f*9||1;document.getElementById('fd-bar').innerHTML='<i style="flex:'+p*4/tot+';background:var(--lime)"></i><i style="flex:'+c*4/tot+';background:var(--calm)"></i><i style="flex:'+f*9/tot+';background:var(--warn)"></i>';
 const g=60/100;document.getElementById('fd-sum').innerHTML='<span><b class="n">'+Math.round(k*g)+'</b> سعر</span><span>ب <b class="n">'+Math.round(p*g)+'</b></span><span>ك <b class="n">'+Math.round(c*g)+'</b></span><span>د <b class="n">'+Math.round(f*g)+'</b></span>';
 document.querySelectorAll('[data-unit]').forEach(u=>{u.parentElement.querySelector('[data-ukcal]').textContent=Math.round(k*(+u.value||0)/100)+' سعر'});}
