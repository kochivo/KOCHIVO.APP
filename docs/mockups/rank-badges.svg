<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 140" width="640" height="140">
<!-- Owner-approved luxury rank badges (2026-11-09). Each badge uses viewBox 0 0 120 130. -->
<defs>
<linearGradient id="gBr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd9b0"/><stop offset=".35" stop-color="#c47f45"/><stop offset=".65" stop-color="#6e3a17"/><stop offset="1" stop-color="#e0a26a"/></linearGradient>
<linearGradient id="gSi" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".4" stop-color="#bfc5ce"/><stop offset=".7" stop-color="#6f7782"/><stop offset="1" stop-color="#eef1f4"/></linearGradient>
<linearGradient id="gGo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff4c2"/><stop offset=".35" stop-color="#e3b448"/><stop offset=".7" stop-color="#8f620e"/><stop offset="1" stop-color="#f6d77e"/></linearGradient>
<linearGradient id="gPl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f1ff"/><stop offset=".45" stop-color="#a99fd0"/><stop offset=".75" stop-color="#4b4470"/><stop offset="1" stop-color="#e4defc"/></linearGradient>
<linearGradient id="gLi" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1ffc4"/><stop offset=".5" stop-color="#c8f550"/><stop offset="1" stop-color="#5f8a10"/></linearGradient>
<radialGradient id="fBr" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#4a2a16"/><stop offset="1" stop-color="#1a0d06"/></radialGradient>
<radialGradient id="fSi" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#3a3f47"/><stop offset="1" stop-color="#121418"/></radialGradient>
<radialGradient id="fGo" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#3d2e0c"/><stop offset="1" stop-color="#140f03"/></radialGradient>
<radialGradient id="fOb" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#2c2840"/><stop offset="1" stop-color="#07060c"/></radialGradient>
<radialGradient id="fCr" cx=".5" cy=".35" r=".8"><stop offset="0" stop-color="#1f2a0a"/><stop offset="1" stop-color="#050703"/></radialGradient>
