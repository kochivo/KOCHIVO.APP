<ellipse cx="80" cy="98.6" rx="3.2" ry="7" transform="rotate(60 80 98.6)"/><ellipse cx="92.8" cy="87" rx="3.2" ry="7" transform="rotate(35 92.8 87)"/><ellipse cx="99.4" cy="71" rx="3.2" ry="7" transform="rotate(10 99.4 71)"/><ellipse cx="98.6" cy="54" rx="3.2" ry="7" transform="rotate(-15 98.6 54)"/><ellipse cx="90.6" cy="38" rx="3.2" ry="7" transform="rotate(-40 90.6 38)"/>
</g>
<path d="M60 46 L64.5 57.9 L77.1 58.4 L67.2 66.3 L70.6 78.6 L60 71.6 L49.4 78.6 L52.8 66.3 L42.9 58.4 L55.5 57.9 Z" fill="url(#gPl)"/>
