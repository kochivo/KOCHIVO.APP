</g>
<!-- champion: silver shield, two chevrons -->
<g transform="translate(130 5)">
<path d="M60 8 L102 22 V60 C102 90 84 110 60 120 C36 110 18 90 18 60 V22 Z" fill="url(#gSi)"/>
