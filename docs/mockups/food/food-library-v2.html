<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مكتبة الأكل</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700&family=Manrope:wght@500;700;800&display=swap">
<style>
/* Captain workspace v11 shell: side nav, then one workspace with tabs. Dark glass, lime is the only action color. */
:root {
  --bg: #0b0c0d; --deep: #060707; --panel: #111213; --line: #262727; --soft: rgba(242,242,238,.07);
  --glass: rgba(255,255,255,.04); --glass-2: rgba(255,255,255,.065); --glass-line: rgba(255,255,255,.09);
  --ink: #f4f4f1; --muted: #a6abb0; --faint: #7d8288;
  --lime: #b6e94f; --lime-dim: rgba(182,233,79,.13); --on-lime: #101418;
  --p: #7cc4ff; --c: #f2b544; --f: #ff8f7a; --demo: #c9a3ff; --ok: #8fe3b0;
  --display: "Alexandria", system-ui, sans-serif; --num: "Manrope", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--display); font-size: 14px; line-height: 1.6; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }
.num { font-family: var(--num); font-weight: 800; font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }
.small { font-size: 12.5px; } .faint { color: var(--faint); } .muted { color: var(--muted); }
h1, h2, h3 { margin: 0; text-wrap: balance; } p { margin: 0; }

.shell { display: grid; grid-template-columns: 228px minmax(0, 1fr); min-height: 100vh; }
.side { border-inline-end: 1px solid var(--line); background: var(--deep); padding: 20px 14px; display: grid; align-content: start; gap: 4px; position: sticky; top: 0; height: 100vh; }
.logo { font-family: var(--num); font-weight: 800; letter-spacing: 1px; padding: 4px 12px 18px; }
.logo i { color: var(--lime); font-style: normal; }
.nav { display: flex; align-items: center; gap: 10px; min-height: 44px; padding-inline: 12px; border-radius: 12px; color: var(--muted); text-decoration: none; font-size: 13.5px; }
.nav.on { background: var(--lime-dim); color: var(--lime); }
.nav svg { width: 18px; height: 18px; flex: none; }
.main { padding-block: 22px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; align-content: start; min-width: 0; max-width: 1240px; width: 100%; margin-inline: auto; }
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.top h1 { font-size: clamp(22px, 3vw, 30px); }
.demo-note { display: inline-flex; gap: 8px; align-items: center; border: 1px dashed rgba(201,163,255,.45); color: var(--demo); border-radius: 999px; padding: 4px 12px; font-size: 12px; }
.lang { display: flex; border: 1px solid var(--glass-line); border-radius: 999px; padding: 3px; }
.lang button { min-height: 36px; padding-inline: 14px; border-radius: 999px; border: 0; background: none; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--glass-2); color: var(--ink); }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { flex: none; min-height: 46px; padding-inline: 16px; border: 0; background: none; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--lime); }
.view[hidden] { display: none !important; }
.view { display: grid; gap: 16px; min-width: 0; }
.view > *, .two > * { min-width: 0; }

.stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)) minmax(0, 1.6fr); gap: 10px; }
.stat { border: 1px solid var(--glass-line); background: var(--glass); border-radius: 18px; padding: 12px 14px; display: grid; gap: 2px; }
.stat .num { font-size: 24px; }
.stat span { color: var(--faint); font-size: 12px; }
.recent { display: flex; flex-wrap: wrap; gap: 6px; }
.recent button { border: 1px solid var(--glass-line); background: var(--glass-2); border-radius: 999px; padding: 2px 10px; font-size: 12px; color: var(--muted); min-height: 30px; }

.searchwrap { display: grid; gap: 8px; }
.search { display: flex; align-items: center; gap: 10px; min-height: 56px; border-radius: 18px; border: 1px solid var(--glass-line); background: var(--glass-2); padding-inline: 16px; }
.search svg { width: 20px; height: 20px; color: var(--faint); flex: none; }
.search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-size: 15px; min-height: 52px; }
.examples { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.examples button { border: 0; background: none; color: var(--lime); font-size: 12.5px; padding: 4px 6px; min-height: 32px; text-decoration: underline dotted; text-underline-offset: 4px; }

.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; max-width: 100%; }
.chip { flex: none; min-height: 38px; padding-inline: 13px; border-radius: 999px; border: 1px solid var(--glass-line); background: var(--glass); color: var(--muted); font-size: 12.5px; }
.chip[aria-pressed="true"] { background: var(--lime-dim); border-color: rgba(182,233,79,.45); color: var(--lime); }
.chip.soft[aria-pressed="true"] { background: var(--glass-2); border-color: rgba(255,255,255,.35); color: var(--ink); }
.seg { display: flex; border: 1px solid var(--glass-line); border-radius: 12px; overflow: hidden; }
.seg button { min-height: 38px; padding-inline: 12px; border: 0; background: none; color: var(--muted); font-size: 12.5px; }
.seg button[aria-pressed="true"] { background: var(--glass-2); color: var(--ink); }

.tablewrap { border: 1px solid var(--glass-line); border-radius: 20px; overflow-x: auto; background: var(--glass); }
table { width: 100%; border-collapse: collapse; min-width: 980px; }
th, td { padding: 10px 12px; text-align: start; border-bottom: 1px solid var(--soft); white-space: nowrap; }
th { font-size: 12px; color: var(--faint); font-weight: 500; position: sticky; top: 0; background: var(--panel); }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--glass-2); }
.fcell { display: flex; align-items: center; gap: 10px; }
.thumb { width: 44px; height: 44px; border-radius: 12px; object-fit: cover; flex: none; background: #1a1b1c; display: grid; place-items: center; font-weight: 700; color: var(--muted); }
.thumb.ph { background: linear-gradient(135deg, #24262a, #141516); border: 1px solid var(--glass-line); font-size: 15px; }
.names b { display: block; font-weight: 600; font-size: 13.5px; }
.names span { font-size: 11.5px; color: var(--faint); }
td .num { font-size: 13.5px; }
.cp { color: var(--p); } .cc { color: var(--c); } .cf { color: var(--f); } .ck { color: var(--lime); }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--glass-line); color: var(--muted); white-space: nowrap; }
.b-verified { color: var(--ok); border-color: rgba(143,227,176,.35); }
.b-recipe { color: #ffe0a0; border-color: rgba(242,181,68,.35); }
.b-proxy { color: #ffc2b5; border-color: rgba(255,143,122,.35); }
.b-demo { color: var(--demo); border-color: rgba(201,163,255,.4); border-style: dashed; }
.b-custom { color: var(--p); border-color: rgba(124,196,255,.35); }
.acts { display: flex; gap: 4px; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--glass-line); background: var(--glass); display: grid; place-items: center; color: var(--muted); }
.icon-btn svg { width: 17px; height: 17px; }
.icon-btn.fav[aria-pressed="true"] { color: var(--c); border-color: rgba(242,181,68,.4); }
.icon-btn.add { color: var(--lime); }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); grid-auto-rows: max-content; gap: 10px; }
.card { border: 1px solid var(--glass-line); background: var(--glass); border-radius: 18px; overflow: hidden; display: grid; text-align: start; padding: 0; }
.card .img { width: 100%; height: auto; aspect-ratio: 4 / 3; object-fit: cover; display: block; }
.card .img.ph { display: grid; place-items: center; font-size: 30px; font-weight: 700; color: var(--faint); background: linear-gradient(135deg, #222428, #121314); }
.card .cb { padding: 8px 10px 10px; display: grid; gap: 4px; }
.card b { font-size: 13px; font-weight: 600; }
.card .row { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 11.5px; color: var(--faint); }

.skel { border-radius: 14px; height: 52px; background: linear-gradient(90deg, var(--glass) 0, var(--glass-2) 50%, var(--glass) 100%); background-size: 200% 100%; animation: sk 1s linear infinite; }
@keyframes sk { to { background-position: -200% 0; } }
.empty { border: 1px dashed var(--glass-line); border-radius: 20px; padding: 36px 16px; text-align: center; display: grid; gap: 10px; justify-items: center; color: var(--muted); }
.empty b { color: var(--ink); font-size: 16px; }

.btn { min-height: 48px; padding-inline: 20px; border-radius: 999px; border: 0; background: var(--lime); color: var(--on-lime); font-weight: 700; box-shadow: inset 0 1px 0 rgba(255,255,255,.45); }
.btn.ghost { background: var(--glass-2); color: var(--ink); border: 1px solid var(--glass-line); box-shadow: none; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

.drawer-bg { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 20; }
.drawer { position: fixed; inset-block: 0; inset-inline-end: 0; width: min(440px, 100%); background: var(--panel); border-inline-start: 1px solid var(--line); z-index: 21; overflow-y: auto; display: grid; align-content: start; padding-bottom: env(safe-area-inset-bottom, 0px); }
.drawer .hero { position: relative; }
.drawer .hero img, .drawer .hero .ph { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; display: grid; place-items: center; font-size: 46px; color: var(--faint); background: linear-gradient(135deg, #222428, #121314); }
.drawer .close { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); inset-inline-start: 12px; background: rgba(0,0,0,.6); }
.dbody { padding: 16px; display: grid; gap: 14px; }
.dbody h2 { font-size: 21px; }
.calc { border: 1px solid var(--glass-line); border-radius: 18px; padding: 12px; display: grid; gap: 10px; background: var(--glass); }
.qty { display: grid; grid-template-columns: 52px 1fr 52px; gap: 8px; align-items: center; }
.qty button { min-height: 52px; border-radius: 14px; border: 1px solid var(--glass-line); background: var(--glass-2); font-size: 22px; }
.qty label { display: flex; align-items: baseline; justify-content: center; gap: 6px; }
.qty input { width: 100px; text-align: center; background: none; border: 0; border-bottom: 1px solid var(--glass-line); font-family: var(--num); font-weight: 800; font-size: 30px; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.tile { border-radius: 14px; background: rgba(0,0,0,.35); border: 1px solid var(--soft); padding: 8px 4px; text-align: center; display: grid; }
.tile .num { font-size: 18px; }
.tile span { font-size: 11px; color: var(--faint); }
.facts { display: grid; grid-template-columns: 1fr auto; border: 1px solid var(--soft); border-radius: 14px; overflow: hidden; }
.facts div { padding: 7px 12px; border-bottom: 1px solid var(--soft); font-size: 13px; }
.facts div:nth-child(odd) { color: var(--muted); }
.facts div:nth-last-child(-n+2) { border-bottom: 0; }
.src { border-radius: 14px; border: 1px solid var(--soft); padding: 10px 12px; display: grid; gap: 2px; font-size: 12.5px; color: var(--muted); }
.src b { color: var(--ink); font-weight: 600; }

.two { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.box { border: 1px solid var(--glass-line); background: var(--glass); border-radius: 22px; padding: 16px; display: grid; gap: 12px; }
.box h3 { font-size: 16px; }
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.field { display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); }
.field.full { grid-column: 1 / -1; }
.field input, .field select, .field textarea { min-height: 46px; border-radius: 12px; border: 1px solid var(--glass-line); background: var(--deep); padding-inline: 12px; font-size: 14px; color: var(--ink); }
.field textarea { min-height: 70px; padding-block: 10px; resize: vertical; }
.field .err { color: var(--f); font-size: 11.5px; min-height: 1em; }
.hint { font-size: 12px; color: var(--faint); }
.ing { display: grid; grid-template-columns: 40px minmax(0, 1fr) 96px 40px; gap: 8px; align-items: center; }
.ing input { min-height: 40px; border-radius: 10px; border: 1px solid var(--glass-line); background: var(--deep); text-align: center; font-family: var(--num); font-weight: 700; width: 100%; }
.ing .thumb { width: 40px; height: 40px; border-radius: 10px; }
.total { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; border-top: 1px solid var(--soft); padding-top: 10px; font-size: 13px; }
.pie { display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: var(--soft); }
.pie i { height: 100%; }
.toast { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); inset-inline-start: 50%; transform: translateX(50%); background: var(--lime); color: var(--on-lime); font-weight: 700; padding: 10px 18px; border-radius: 999px; z-index: 30; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
[dir="ltr"] .toast { transform: translateX(-50%); }
.mealcol { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.meal { border: 1px solid var(--glass-line); border-radius: 18px; padding: 10px; display: grid; gap: 8px; align-content: start; background: var(--deep); }
.meal.on { border-color: rgba(182,233,79,.5); }
.meal header { display: flex; justify-content: space-between; font-size: 13px; }
.mi { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 12.5px; }
.mi .thumb { width: 32px; height: 32px; border-radius: 8px; font-size: 12px; }
.mi.new { animation: pop .5s ease; }
@keyframes pop { from { background: var(--lime-dim); } }
.ko { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.prompts { display: flex; flex-wrap: wrap; gap: 8px; }
.prompts button { border: 1px solid var(--glass-line); background: var(--glass-2); border-radius: 14px; padding: 10px 14px; text-align: start; min-height: 48px; }
.bubble { border-radius: 18px; padding: 12px 14px; max-width: 760px; }
.bubble.me { background: var(--glass-2); justify-self: end; }
.bubble.ai { background: var(--glass); border: 1px solid var(--glass-line); display: grid; gap: 10px; }
.sugg { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.sugg > div { border: 1px solid var(--soft); border-radius: 14px; padding: 8px; display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 8px; align-items: center; }
.typing { display: inline-flex; gap: 4px; } .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); animation: bl 1s infinite; } .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes bl { 50% { opacity: .2; } }
@media (prefers-reduced-motion: reduce) { .skel, .typing i, .mi.new { animation: none; } }
@media (max-width: 1100px) { .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); } .stats .wide { grid-column: 1 / -1; } .mealcol { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 860px) { .shell { grid-template-columns: 1fr; } .side { display: none; } .two { grid-template-columns: 1fr; } }
@media (max-width: 520px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .form { grid-template-columns: 1fr; } .mealcol { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="shell">
  <nav class="side" aria-label="KOCHIVO">
    <div class="logo">KOCHIV<i>O</i></div>
    <a class="nav" href="#" data-t="navHome"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9H3z"/></svg><span></span></a>
    <a class="nav" href="#" data-t="navPlayers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M17 11a3 3 0 1 0 0-6M22 21c0-3-2-5-5-5"/></svg><span></span></a>
    <a class="nav" href="#" data-t="navPrograms"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6v12M18 6v12M3 9v6M21 9v6M6 12h12"/></svg><span></span></a>
    <a class="nav on" href="#" data-t="navNutrition" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21c5 0 8-4 8-9H4c0 5 3 9 8 9zM8 8c0-3 2-5 4-5M12 3c2 0 4 2 4 5"/></svg><span></span></a>
    <a class="nav" href="#" data-t="navInbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v11H8l-4 4z"/></svg><span></span></a>
  </nav>

  <main class="main">
    <div class="top">
      <div style="display:grid;gap:6px">
        <span class="demo-note" data-t="demoBanner"></span>
        <h1 data-t="title"></h1>
        <p class="muted small" data-t="subtitle"></p>
      </div>
      <div class="lang" role="group" aria-label="Language"><button data-lang="ar" aria-pressed="true">عربي</button><button data-lang="en" aria-pressed="false">English</button></div>
    </div>

    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-view="lib" aria-selected="true" data-t="tabLib"></button>
      <button class="tab" role="tab" data-view="custom" aria-selected="false" data-t="tabCustom"></button>
      <button class="tab" role="tab" data-view="recipe" aria-selected="false" data-t="tabRecipe"></button>
      <button class="tab" role="tab" data-view="plan" aria-selected="false" data-t="tabPlan"></button>
      <button class="tab" role="tab" data-view="ko" aria-selected="false" data-t="tabKo"></button>
    </div>

    <section class="view" id="v-lib">
      <div class="stats" id="stats"></div>
      <div class="searchwrap">
        <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" autocomplete="off"></div>
        <div class="examples" id="examples"></div>
      </div>
      <div class="filters">
        <div class="chips" id="regions" role="group"></div>
      </div>
      <div class="filters">
        <div class="chips" id="nutri" role="group"></div>
        <div class="seg" role="group" id="layout"><button data-l="table" aria-pressed="true" data-t="table"></button><button data-l="cards" aria-pressed="false" data-t="cards"></button></div>
      </div>
      <div class="small faint" id="count"></div>
      <div id="results"></div>
    </section>

    <section class="view" id="v-custom" hidden>
      <div class="two">
        <form class="box" id="customForm" novalidate>
          <h3 data-t="customTitle"></h3>
          <div class="form">
            <label class="field"><span data-t="fNameEn"></span><input id="cEn" value="Protein pancake"></label>
            <label class="field"><span data-t="fNameAr"></span><input id="cAr" value="بان كيك بروتين"></label>
            <label class="field"><span data-t="fCategory"></span><select id="cRegion"></select></label>
            <label class="field"><span data-t="fServing"></span><input id="cServ" type="number" min="1" value="120" inputmode="decimal"></label>
            <label class="field"><span data-t="fKcal"></span><input id="cK" type="number" min="0" value="210" inputmode="decimal"><span class="err" id="eK"></span></label>
            <label class="field"><span data-t="fProtein"></span><input id="cP" type="number" min="0" step="0.1" value="18" inputmode="decimal"></label>
            <label class="field"><span data-t="fCarbs"></span><input id="cC" type="number" min="0" step="0.1" value="22" inputmode="decimal"></label>
            <label class="field"><span data-t="fFat"></span><input id="cF" type="number" min="0" step="0.1" value="5" inputmode="decimal"></label>
            <label class="field"><span data-t="fFiber"></span><input id="cFi" type="number" min="0" step="0.1" value="3" inputmode="decimal"></label>
            <label class="field full"><span data-t="fNotes"></span><textarea id="cN"></textarea></label>
          </div>
          <p class="hint" data-t="customHint"></p>
          <button class="btn" id="cSave" type="submit" data-t="saveCustom"></button>
        </form>
        <div class="box"><h3 data-t="preview"></h3><div id="cPreview"></div><div id="cList"></div></div>
      </div>
    </section>

    <section class="view" id="v-recipe" hidden>
      <div class="two">
        <div class="box">
          <h3 data-t="recipeTitle"></h3>
          <label class="field"><span data-t="recipeName"></span><input id="rName" value="كشري"></label>
          <div class="hint" data-t="ingredients"></div>
          <div id="ings" style="display:grid;gap:8px"></div>
          <div style="display:flex;gap:8px;flex-wrap:wrap"><select id="rAddSel" class="field" style="flex:1;min-height:44px;border-radius:12px;border:1px solid var(--glass-line);background:var(--deep);padding-inline:10px;min-width:0"></select><button class="btn ghost" id="rAdd" type="button" data-t="addIngredient"></button></div>

  ['suggest40', { ar: 'اقترح وجبة مصري فيها 40 جم بروتين', en: 'Suggest an Egyptian meal with 40 g protein' }, [['s2', 120], ['s17', 90], ['s11', 150]], { ar: 'صدور فراخ 120 جم مع رغيف بلدي وطبق فول من غير زيت. ده بيدّي حوالي 40 جم بروتين.', en: 'Chicken breast 120 g, a baladi loaf and a plate of fava beans without oil. That gives about 40 g protein.' }],
  ['highp', { ar: 'لاقيلي أكل مصري بروتين عالي', en: 'Find high-protein Egyptian foods' }, [['s26', 100], ['s11', 100], ['s13', 100], ['s32', 245]], { ar: 'دول أعلى أكلات مصري في البروتين في المكتبة، مرتبين بالبروتين في 100 جم.', en: 'These are the Egyptian foods highest in protein in the library, sorted per 100 g.' }],
  ['lowfat', { ar: 'اقترح عشا عربي دهونه قليلة', en: 'Suggest a low-fat Arabic dinner' }, [['d20', 250], ['d15', 150]], { ar: 'طاجين فراخ مع فتوش. الاتنين أرقامهم تجريبية في الموكاب ده.', en: 'Chicken tagine with fattoush. Both have demo numbers in this mockup.' }],
  ['swap', { ar: 'بدّل الرز بكارب يساويه', en: 'Replace rice with an equivalent carbohydrate source' }, [['s0', 200], ['s22', 260], ['s24', 250], ['s21', 180]], { ar: '200 جم رز أبيض = حوالي 56 جم كارب. الكميات دي بتدّي نفس الكارب تقريبًا.', en: '200 g white rice ≈ 56 g carbs. These amounts give about the same carbs.' }],
];
let koMsgs = [];
function renderKo() {
  document.getElementById('koPrompts').innerHTML = KO.map(([k, q]) => `<button data-ko="${k}">${esc(q[lang])}</button>`).join('');
  document.getElementById('koChat').innerHTML = koMsgs.map(m => {
    const it = KO.find(x => x[0] === m.k);
    if (m.me) return `<div class="bubble me">${esc(it[1][lang])}</div>`;
    if (m.wait) return `<div class="bubble ai"><span class="typing" aria-label="${t('koThinking')}"><i></i><i></i><i></i></span></div>`;
    return `<div class="bubble ai"><span>${esc(it[3][lang])}</span><div class="sugg">${it[2].map(([id, g]) => { const f = FOODS.find(x => x.id === id), m = g / 100; return `<div>${thumb(f)}<div><b style="font-size:13px;font-weight:600">${esc(name(f))}</b> ${f.status === 'demo' ? badge(f) : ''}<div class="small faint"><span class="num">${g}</span>${t('grams')} · <span class="num ck">${Math.round(f.k * m)}</span> ${t('kcal')} · <span class="num cp">${r1(f.p * m)}</span> ${t('protein')} · <span class="num cc">${r1(f.c * m)}</span> ${t('carbs')}</div></div></div>`; }).join('')}</div><span class="small faint">${t('koNote')}</span></div>`;
  }).join('');
}

/* ---------- wiring ---------- */
function renderAll() {
  document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-t]').forEach(el => { const tgt = el.querySelector('span') && el.classList.contains('nav') ? el.querySelector('span') : el; tgt.textContent = t(el.dataset.t); });
  document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  renderStats(); renderControls(); renderResults(); renderCustom(); renderRecipe(); renderPlanForm(); renderKo(); renderDrawer();
}
function go(view) {
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.view === view));
  document.querySelectorAll('.view').forEach(v => v.hidden = v.id !== 'v-' + view);
}
function addToMealFlow(id) { dFood = null; renderDrawer(); go('plan'); document.getElementById('pFood').value = id; document.getElementById('pQty').value = servingsOf(FOODS.find(f => f.id === id))[0][2]; renderPlan(); }

document.addEventListener('click', e => {
  const b = e.target.closest('button, [data-row], [data-close]'); if (!b) return;
  const d = b.dataset;
  if (d.lang) { lang = d.lang; renderAll(); }
  else if (d.view) go(d.view);
  else if (d.go) go(d.go);
  else if (d.ex) { document.getElementById('q').value = d.ex; region = 'all'; renderControls(); search(); }
  else if (d.r) { region = d.r; renderControls(); renderResults(); }
  else if (d.n) { nf.has(d.n) ? nf.delete(d.n) : nf.add(d.n); renderControls(); renderResults(); }
  else if (d.l) { layout = d.l; document.querySelectorAll('[data-l]').forEach(x => x.setAttribute('aria-pressed', x.dataset.l === layout)); renderResults(); }
  else if (d.fav) { FAV.has(d.fav) ? FAV.delete(d.fav) : FAV.add(d.fav); renderResults(); }
  else if (d.addmeal) addToMealFlow(d.addmeal);
  else if (d.open) openDrawer(d.open);
  else if (d.close !== undefined) { dFood = null; renderDrawer(); }
  else if (d.q) { dQty = Math.max(1, dQty + +d.q); document.getElementById('dq').value = dQty; renderTiles(); }
  else if (d.sv) { dQty = +d.sv; document.getElementById('dq').value = dQty; renderTiles(); }
  else if (d.rm) { ings.splice(+d.rm, 1); renderRecipe(); }
  else if (d.ko) { koMsgs.push({ k: d.ko, me: true }, { k: d.ko, wait: true }); renderKo(); setTimeout(() => { koMsgs = koMsgs.filter(m => !m.wait); koMsgs.push({ k: d.ko }); renderKo(); }, 900); }
  else if (d.row) openDrawer(d.row);
  else if (b.id === 'rAdd') { const id = document.getElementById('rAddSel').value; ings.push([[...FOODS, DEMO_ING.onion, DEMO_ING.sauce].find(f => f.id === id), 100]); renderRecipe(); }
  else if (b.id === 'rSave') { const tot = ings.reduce((a, [f, g]) => ({ k: a.k + f.k * g / 100, p: a.p + f.p * g / 100, c: a.c + f.c * g / 100, f: a.f + f.f * g / 100 }), { k: 0, p: 0, c: 0, f: 0 }); const cw = val('rCooked') || 1, nm = document.getElementById('rName').value || 'وصفة';
    FOODS.push({ id: 'c' + Date.now(), ar: nm, en: nm, k: tot.k * 100 / cw, p: tot.p * 100 / cw, c: tot.c * 100 / cw, f: tot.f * 100 / cw, fi: null, su: null, na: null, status: 'custom', region: 'mine', type: 'c', prepAr: 'وصفة الكابتن', prepEn: 'Coach recipe', serv: [['طبق وسط', 'Medium plate', 350]] });
    renderStats(); renderPlanForm(); previewCustom(); toast(t('saved')); }
  else if (b.id === 'pAdd') { const id = document.getElementById('pFood').value, meal = document.getElementById('pMeal').value; plan[meal].push([FOODS.find(f => f.id === id), val('pQty') || 100]); lastAdded = [meal, plan[meal].length - 1]; renderPlan(); toast(t('added')); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'q') search();
  else if (el.id === 'dq') { dQty = Math.max(0, +el.value || 0); renderTiles(); }
  else if (el.dataset.ig) { ings[+el.dataset.ig][1] = Math.max(0, +el.value || 0); recipeOut(); }
  else if (el.id === 'rCooked' || el.id === 'rName') recipeOut();
  else if (el.closest('#customForm')) previewCustom();
  else if (['pQty', 'pFood', 'pMeal', 'pClient'].includes(el.id)) renderPlan();
});
document.addEventListener('change', e => { if (['pFood', 'pMeal', 'pClient', 'cRegion'].includes(e.target.id)) { renderPlan(); previewCustom(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && dFood) { dFood = null; renderDrawer(); } });
document.getElementById('customForm').addEventListener('submit', e => {
  e.preventDefault(); const d = customDraft();
  if (!d.ar) { document.getElementById('cAr').focus(); toast(t('nameNeeded')); return; }
  d.region = d.region || 'mine'; if (d.region !== 'mine') d.status = 'custom';
  FOODS.push(d); RECENT.unshift(d.id); renderStats(); previewCustom(); renderPlanForm(); toast(t('saved'));
});
renderAll();
</script>
</body>
