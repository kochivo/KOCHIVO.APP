#kochivo-premium[data-appearance='dark'] { color-scheme: dark; }
#kochivo-premium[data-appearance='light'] { color-scheme: light; }
#kochivo-premium *, #kochivo-premium *::before, #kochivo-premium *::after { box-sizing: border-box; }
#kochivo-premium h1, #kochivo-premium h2, #kochivo-premium h3, #kochivo-premium p { margin: 0; }
#kochivo-premium h1 { font-size: clamp(26px, 3vw, 34px); font-weight: 600; line-height: 1.6; }
#kochivo-premium h2 { font-size: 20px; font-weight: 600; line-height: 1.7; }
#kochivo-premium h3 { font-size: 17px; font-weight: 600; }
#kochivo-premium p { color: var(--k-muted); }
#kochivo-premium small, #kochivo-premium .k-small { font-size: 12px; line-height: 1.8; }
#kochivo-premium .k-muted { color: var(--k-muted); }
#kochivo-premium .k-eyebrow { color: var(--k-lime-ink); font-size: 12px; font-weight: 500; }
#kochivo-premium .k-concept-toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; padding: 12px 20px 18px; padding-inline-end: 96px; font-size: 12px; background: var(--k-bg); }
#kochivo-premium .k-concept-toolbar label { display: flex; flex-direction: column; gap: 4px; flex: 1; min-inline-size: 150px; }
#kochivo-premium .k-concept-toolbar select { background: var(--k-surface); color: var(--k-ink); border: 1px solid var(--k-line); border-radius: 8px; min-block-size: 48px; padding-inline: 12px; font: inherit; inline-size: 100%; }

function pageFor(id) { return pages.find(page => page.id === id) ?? pages[0]; }
function filterPlayers(roster, search) {
  const query = String(search).trim().toLocaleLowerCase('ar');
  return roster.filter(player => `${player.name} ${player.phone}`.toLocaleLowerCase('ar').includes(query));
}

const footer = () => `<footer class="k-site-footer"><span>${m.copyright}</span><span>${m.credit}</span>${go(m.signIn, 'login')}</footer>`;
const athleteTabs = active => `<nav class="k-tabs" aria-label="${m.clientName}">${['athlete', 'athlete-programs', 'athlete-nutrition', 'athlete-preview'].map((id, i) => `<button type="button" data-page="${id}" aria-current="${id === active ? 'page' : 'false'}">${m.playerTabs[i]}</button>`).join('')}</nav>`;

function weightChart() {
  const values = [82.5, 81.8, 81.2, 80.4];
  return `<div class="k-weight-chart" role="img" aria-label="${esc(m.weightJourney)}: 82.5, 81.8, 81.2, 80.4 ${m.kg}">
    <div class="k-chart-values">${values.map((value, i) => `<div><strong dir="ltr">${value}</strong><span class="k-chart-mark" style="block-size:${70 + (value - 80) * 30}px"></span><small>${m.chartWeeks[i]}</small></div>`).join('')}</div>
    <span class="k-muted">${m.kg}</span></div>`;
}

function profileSettings(isPlayer) {
  return `${heading(m.settingsTitle, m.settingsSub)}<div class="k-settings-layout"><nav class="k-settings-nav">${m.settingsGroups.map((name, i) => `<button type="button" data-settings="${i}" aria-pressed="${i === 0}">${name}</button>`).join('')}</nav>
    <form class="k-settings-form" data-form="settings"><div class="k-profile-line">${avatar(isPlayer ? m.clientInitials : m.coachInitials, true)}<div><h2>${isPlayer ? m.clientName : m.coachName}</h2><p>${isPlayer ? m.memberSince : m.coachRole}</p></div></div>
    <div class="k-form-grid">${field(m.name, isPlayer ? m.clientName : m.coachName)}${field(m.email, isPlayer ? m.playerEmail : m.emailExample, 'email')}</div>
    ${field(m.phone, '+201012345678', 'tel')}<label class="k-field"><span>${m.bio}</span><textarea rows="3">${m.bioText}</textarea></label>

      <div class="k-pricing-list">${m.plans.map(([name, price, hint], i) => `<div><h3 dir="ltr">${name}</h3><p>${hint}</p><strong dir="ltr">${price}</strong><small>${m.currency}</small>${go(i ? m.next : m.startFree, 'login', i === 1)}</div>`).join('')}</div></section>
    <section class="k-public-section k-faq">${heading(m.faq, '')}${m.questions.map(([q, a]) => `<details><summary>${q}${icon('plus')}</summary><p>${a}</p></details>`).join('')}</section>
    <section class="k-final-cta"><h2>${m.footer}</h2>${go(m.startFree, 'login', true, 'arrow-up-left')}</section>${footer()}`;
}

function renderPublic(page) {
  if (page.id === 'site') return landing();
  if (page.id === 'coach-site') return `${siteHeader()}<section class="k-coach-public"><div class="k-coach-photo">${photo('k-editorial-image')}<span dir="ltr">${m.coachLatin}</span></div><div><p class="k-eyebrow">${m.publicCoachEyebrow}</p>${avatar(m.coachInitials, true)}<h1>${m.publicCoachHeading}</h1><p>${m.publicCoachBody}</p>${go(m.requestJoin, 'invite', true, 'arrow-up-left')}<h2>${m.coachingIncludes}</h2>${list(m.coachingItems.map((item, i) => [item, '', `0${i + 1}`]))}</div></section>${footer()}`;
  if (page.id === 'demo') return `${siteHeader()}<section class="k-choice-page">${heading(m.demoTitle, m.demoBody)}<div class="k-role-choices"><button data-page="coach-home" type="button">${icon('layout-dashboard')}<h2>${m.demoCoach}</h2><p>${m.demoCoachHint}</p>${icon('arrow-up-left')}</button><button data-page="player-home" type="button">${icon('dumbbell')}<h2>${m.demoPlayer}</h2><p>${m.demoPlayerHint}</p>${icon('arrow-up-left')}</button></div></section>${footer()}`;
  return `${siteHeader()}<section class="k-ko-page"><span class="k-ko-monogram" dir="ltr">KO.</span>${heading(m.koTitle, m.koBody)}${act(m.koAction, 'join-ko', true, 'arrow-up-left')}</section>${footer()}`;
}

function renderAuth(page, state) {
  let title = m.welcome, body = m.authBody, form;
  if (page.id === 'invite') {
    title = state.otp ? m.otpTitle : m.inviteHeading;
    body = state.otp ? m.otpBody : m.inviteBody;
    form = state.otp ? `${field(m.otpLabel, '', 'text', 'otp')}<button type="submit" class="k-button k-primary">${m.next}</button>` :
      `${act(m.google, 'google-player')}${field(m.email, m.playerEmail, 'email', 'email')}<button type="submit" class="k-button k-primary">${m.sendCode}</button>`;
  } else if (page.id === 'forgot') {
    title = m.forgotTitle; body = m.forgotBody;
    form = `${field(m.email, m.emailExample, 'email', 'email')}<button type="submit" class="k-button k-primary">${m.sendCode}</button>${go(m.back, 'login')}`;
  } else if (page.id === 'reset') {
    title = m.resetTitle; body = m.resetBody;
    form = `${field(m.newPassword, '', 'password', 'password')}${field(m.confirmPassword, '', 'password', 'confirm')}<button type="submit" class="k-button k-primary">${m.save}</button>`;
  } else {
    if (state.signup) { title = m.signup; body = m.signupBody; }
    form = `${act(m.google, 'google-coach')}<span class="k-or">${m.orEmail}</span>${state.signup ? field(m.name, '', 'text', 'name') : ''}${field(m.email, m.emailExample, 'email', 'email')}${field(m.password, '', 'password', 'password')}
      <div class="k-auth-link">${go(m.forgot, 'forgot')}</div><button type="submit" class="k-button k-primary">${state.signup ? m.startFree : m.signIn}</button>${act(state.signup ? m.signIn : m.newCoach, 'toggle-signup')}`;
  }
  return `<div class="k-auth-layout"><aside class="k-auth-editorial">${photo('k-editorial-image')}<div>${brand()}<h2>${m.authQuote}<br>${m.authQuoteTwo}</h2><p>${m.authFoot}</p></div></aside><section class="k-auth-main">${brand()}${heading(title, body)}<form data-form="${page.id}">${form}<p class="k-form-error" role="alert"></p></form><p class="k-small k-muted">${m.playerInviteHint}</p></section></div>`;
}

function rosterTable(query = '', billing = false) {
  const roster = filterPlayers(m.roster, query);
  if (!roster.length) return `<div class="k-empty">${icon('search')}<h2>${m.noResults}</h2><p>${m.noResultsHint}</p></div>`;
  return table(m.rosterHeaders, roster.map(player => [
    `<button type="button" class="k-person" data-page="athlete">${avatar(player.initials)}<span><strong>${esc(player.name)}</strong><small>${esc(player.status)}</small></span></button>`,
    esc(player.activity), `<span dir="ltr">${player.adherence}</span>`, esc(player.subscription),
    billing ? act(m.renew, 'renew') : go(m.open, 'athlete', false, 'arrow-up-left'),
  ]));
}

function dashboard() {
  return `${heading(m.coachGreeting, m.coachSubtitle, act(m.invite, 'invite', true, 'plus'))}${stats(m.coachStats)}
    <section class="k-attention"><div>${tag(m.attention)}<h2>${m.attentionBody}</h2></div>${go(m.reviewNow, 'inbox', false, 'arrow-up-left')}</section>
    <div class="k-dashboard-columns"><section>${sectionTitle(m.activity, go(m.players, 'roster'))}${list(m.activityItems)}</section>
      <section class="k-week-section">${sectionTitle(m.weekly)}<div class="k-week">${m.weekDays.map((d, i) => `<div${i === 4 ? ' class="is-today"' : ''}><small>${d}</small><strong>${m.weekNumbers[i]}</strong><span>${i < 4 ? icon('check') : ''}</span></div>`).join('')}</div><p class="k-muted">${m.date}</p><div class="k-inline-note">${icon('calendar-days')}<span>${m.planName}<br><small>${m.planDetail}</small></span></div></section></div>`;
}

function athlete(page) {
  const intro = `${heading(m.clientName, m.athleteSubtitle, act(m.edit, 'saved'))}${athleteTabs(page.id)}`;
  if (page.id === 'athlete-programs') return `${intro}${sectionTitle(m.currentPlan, go(m.editPlan, 'program', true))}<div class="k-plan-list">${m.programDays.map((day, i) => `<button type="button" data-page="program"><span class="k-process-no">0${i + 1}</span><div><h2>${day}</h2><p>${m.playerWorkoutSub}</p></div>${icon('arrow-up-left')}</button>`).join('')}</div>`;
  if (page.id === 'athlete-nutrition') return `${intro}${stats(m.macros)}${sectionTitle(m.assignedFood, go(m.edit, 'meal-builder', true))}${list(m.meals.map(([name, title, , calories]) => [name, title, `${calories} ${m.kcal}`]))}`;
  if (page.id === 'athlete-preview') return `${intro}<div class="k-preview-header"><h2>${m.previewTitle}</h2><p>${m.previewSub}</p>${go(m.demoPlayer, 'player-home', true)}</div><div class="k-mini-workout"><small>${m.trainingDay}</small><h2>${m.playerWorkoutTitle}</h2><p>${m.playerWorkoutSub}</p>${go(m.startWorkout, 'workout', true)}</div>`;
  return `${intro}${stats(m.athleteStats)}<div class="k-two-columns"><section>${sectionTitle(m.currentPlan)}<div class="k-text-feature"><span>${icon('dumbbell')}</span><h2>${m.planName}</h2><p>${m.planDetail}</p>${go(m.editPlan, 'program', true)}</div></section>
    <section>${sectionTitle(m.assignedFood)}<div class="k-text-feature"><span>${icon('utensils')}</span><h2>${m.assignedFood}</h2><p>${m.foodPlanDetail}</p>${go(m.open, 'meal-builder')}</div></section></div>${sectionTitle(m.athleteNotes)}<p class="k-note-copy">${m.athleteNoteBody}</p>${sectionTitle(m.activity)}${list(m.activityItems.slice(0, 2))}`;
}

function programs(state) {
  return `${heading(m.programTitle, m.programSub, act(m.save, 'saved', true))}<nav class="k-tabs" aria-label="${m.training}">${m.programDays.map((day, i) => `<button type="button" data-day="${i}" aria-current="${state.day === i ? 'page' : 'false'}">${day}</button>`).join('')}</nav>
    ${table(m.exerciseHeaders, [...m.exercises, ...state.extraExercises].map(([name, sets, reps, rest]) => [`<span class="k-exercise-title">${icon('grip-vertical')}${esc(name)}</span>`, `<input class="k-cell-input" aria-label="${m.sets} ${esc(name)}" type="number" value="${sets}" min="1" max="10">`, `<span dir="ltr">${reps}</span>`, rest]))}
    <div class="k-builder-bottom">${act(m.addExercise, 'exercise', false, 'plus')}<span class="k-muted">${m.planDetail}</span></div>`;
}

function mealsBuilder() {
  return `${heading(m.assignedFood, m.mealSub, act(m.save, 'saved', true))}${stats(m.macros)}<div class="k-meal-editor">${m.meals.map(([name, title, amount, kcal], i) => `<section>${sectionTitle(`${String(i + 1).padStart(2, '0')} / ${name}`, act(m.edit, 'saved'))}<h3>${title}</h3><p>${amount}</p><div class="k-meal-bottom"><span>${kcal} ${m.kcal}</span>${act(m.add, 'food', false, 'plus')}</div></section>`).join('')}</div>`;

function inbox(state) {
  const selected = state.inbox ?? 0;
  return `${heading(m.inboxTitle, m.inboxSub)}<div class="k-inbox-layout"><nav class="k-inbox-list">${m.inboxNames.map(([name, type, time], i) => `<button type="button" data-inbox="${i}" aria-pressed="${selected === i}"><strong>${name}</strong><span>${type}</span><small>${time}</small></button>`).join('')}</nav>
    <section class="k-review">${sectionTitle(m.inboxNames[selected][0], tag(state.replied ? m.completed : m.pending))}${selected === 1 ? `<div class="k-video-placeholder">${photo('k-editorial-image')}${icon('play')}</div>` : stats(m.checkinMetrics)}<p class="k-note-copy">${m.checkinText}</p>
    <form data-form="reply"><label class="k-field"><span>${m.replyLabel}</span><textarea rows="4" placeholder="${m.replyHint}"></textarea></label><div class="k-action-row">${act(m.formButton, 'saved', false, 'mic')}<button type="submit" class="k-button k-primary">${m.replyButton}</button></div></form></section></div>`;
}

function leaderboard() {
  return `${heading(m.boardTitle, m.boardSub)}<div class="k-month-line"><span>${m.monthName}</span>${tag(m.crown)}</div><div class="k-crown-feature">${icon('crown')}<div><small>${m.crownHint}</small><h2>${m.roster[4].name}</h2></div><strong dir="ltr">96<span>%</span></strong></div>
    ${table(m.boardColumns, m.boardRows.map(row => row.map((value, i) => `<span${i === 0 || i > 1 ? ' dir="ltr"' : ''}>${value}</span>`)))}`;
}

function renderCaptain(page, state) {
  if (page.id === 'coach-home') return dashboard();
  if (page.id === 'roster') return `${heading(m.rosterTitle, m.rosterSubtitle, act(m.invite, 'invite', true, 'plus'))}<label class="k-search">${icon('search')}<input id="k-roster-search" type="search" placeholder="${m.search}" aria-label="${m.search}" value="${esc(state.search)}"></label><div id="k-roster-table">${rosterTable(state.search)}</div>`;
  if (page.id.startsWith('athlete')) return athlete(page);
  if (page.id === 'program') return programs(state);
  if (page.id === 'meal-builder') return mealsBuilder();
  if (page.id === 'inbox') return inbox(state);
  if (page.id === 'leaderboard') return leaderboard();
  if (page.id === 'templates') return `${heading(m.templateTitle, m.templateSubtitle, act(m.createTemplate, 'template', true, 'plus'))}<div class="k-library">${m.templateNames.map(([name, kind, detail], i) => `<button type="button" data-page="${i === 2 ? 'meal-builder' : 'program'}"><span class="k-library-index" dir="ltr">0${i + 1}</span><div><small>${kind}</small><h2>${name}</h2><p>${detail}</p></div>${icon('arrow-up-left')}</button>`).join('')}</div>`;
  if (page.id === 'billing') return `${heading(m.billingTitle, m.billingSub)}${stats(m.billingStats)}<div class="k-subscription-line"><div><h2>${m.subscriptionLabel}</h2><p>${m.nextRenewal}</p></div>${act(m.edit, 'saved')}</div>${rosterTable('', true)}`;
  return profileSettings(false);
}

function captainShell(page, body) {
  const menu = [['coach-home', 'house', m.home], ['roster', 'users-round', m.players], ['inbox', 'inbox', m.inbox], ['templates', 'layers-2', m.templates], ['leaderboard', 'trophy', m.leaderboard], ['billing', 'credit-card', m.billing], ['coach-settings', 'settings-2', m.settings]];
  const selected = page.id.startsWith('athlete') ? 'roster' : ['program', 'meal-builder'].includes(page.id) ? 'templates' : page.id;
  return `<div class="k-captain-shell"><aside class="k-sidebar"><div class="k-sidebar-brand">${go(m.brand, 'site')}</div><nav>${menu.map(([id, glyph, title]) => `<button data-page="${id}" type="button" aria-current="${selected === id ? 'page' : 'false'}">${icon(glyph)}<span>${title}</span>${id === 'inbox' ? '<small>3</small>' : ''}</button>`).join('')}</nav><div class="k-coach-id">${avatar(m.coachInitials)}<div><strong>${m.coachName}</strong><small>${m.coachRole}</small></div></div></aside><div class="k-workspace"><div class="k-workspace-bar"><span>${m.date}</span><span class="k-coach-mobile-menu">${act(m.menu, 'coach-menu', false, 'menu')}</span>${act(m.notifications, 'notifications', false, 'bell')}</div><main class="k-workspace-content">${body}</main></div></div>`;
}

    <section class="k-player-week">${sectionTitle(m.weekProgress, `<span class="k-muted">${m.weekDone}</span>`)}<div class="k-week">${m.weekDays.map((day, i) => `<button type="button" data-week="${i}" aria-pressed="${state.week === i}"><small>${day}</small><span>${[0, 2].includes(i) ? icon('check') : m.weekNumbers[i]}</span></button>`).join('')}</div></section>
    <div class="k-two-columns"><section class="k-readiness">${sectionTitle(m.readiness, act(m.edit, 'readiness'))}<p>${m.readinessSub}</p><div class="k-readiness-values"><span>${m.sleepValue}</span><span>${m.sorenessValue}</span></div></section>
    <section class="k-water">${sectionTitle(m.water)}<p class="k-water-number glass-strong"><strong dir="ltr">${state.water.toFixed(2).replace(/0$/, '')}</strong><span>${m.waterGoal}</span></p>${act(m.addWater, 'water', false, 'plus')}</section></div>
    ${sectionTitle(m.nextMeal, go(m.nutrition, 'nutrition'))}<div class="k-next-meal"><div><h3>${m.nextMealTitle}</h3><p>${m.mealHint}</p></div>${icon('utensils')}</div>`;

function workout(state) {

  return `${go(m.back, 'player-home', false, 'arrow-right')}<div class="k-workout-topline"><span>${m.training}</span><span dir="ltr">${state.set + 1} / 3</span></div>${heading(m.workoutTitle, m.workoutProgress.replace('{set}', String(state.set + 1)))}
    <div class="k-exercise-media">${photo('k-editorial-image')}<span>${m.trainingDay}</span></div><p class="k-last-performance">${m.lastPerformance}</p>
    <div class="k-two-columns">${stepper(m.weightLabel, state.weight, m.kg, 'weight')}${stepper(m.repsLabel, state.reps, m.reps, 'reps')}</div>${act(m.finishSet, 'finish-set', true, 'check')}<div class="k-form-link">${act(m.formButton, 'form-review', false, 'video')}</div>`;

function nutrition(state) {
  return `${heading(m.mealTitle, m.mealSub)}${stats(m.macros)}<div class="k-meals">${m.meals.map(([name, title, amount, calories], i) => `<section class="k-meal"><div class="k-meal-index" dir="ltr">0${i + 1}</div><div class="k-meal-info"><div class="k-meal-heading"><small>${name}</small><span>${calories} ${m.kcal}</span></div><h2>${state.swaps[i]?.[0] ?? title}</h2><p>${state.swaps[i]?.[1] ?? amount}</p><div class="k-action-row"><button type="button" class="k-button ${state.eaten.includes(i) ? 'k-done' : ''}" data-meal="${i}" aria-pressed="${state.eaten.includes(i)}">${icon(state.eaten.includes(i) ? 'check-check' : 'check')}${state.eaten.includes(i) ? m.eatenDone : m.eaten}</button><button type="button" class="k-button" data-swap="${i}">${m.swap}${icon('repeat-2')}</button></div></div></section>`).join('')}</div>`;

function progress() {

function rank() {

    <section class="k-crown-note">${icon('crown')}<div><h2>${m.crownPlayerHint}</h2><p>${m.crownRule}</p></div></section>${sectionTitle(m.points)}${list(m.pointsHistory.map(([reason, points]) => [reason, m.date, points]))}`;

function onboarding(state) {
  const step = state.intakeStep ?? 0;
  const sections = [
    `${field(m.name, state.intake?.name ?? m.clientName, 'text', 'name')}<div class="k-form-grid">${field(m.age, '25', 'number', 'age')}${field(m.height, '175', 'number', 'height')}${field(m.weight, '80', 'number', 'weight')}</div>`,
    `<fieldset><legend>${m.schedule}</legend><div class="k-choice-days">${m.weekDays.map((d, i) => `<label><input type="checkbox" name="day-${i}"${i % 2 === 0 ? ' checked' : ''}><span>${d}</span></label>`).join('')}</div></fieldset>`,
    `<label class="k-field"><span>${m.health}</span><textarea rows="4">${m.noHealth}</textarea></label>`,
    `<label class="k-field"><span>${m.foodAllergy}</span><select>${m.allergies.map(a => `<option>${a}</option>`).join('')}</select></label>`,

}

function renderPlayer(page, state) {
  if (page.id === 'player-home') return playerHome(state);
  if (page.id === 'workout') return workout(state);
  if (page.id === 'nutrition') return nutrition(state);
  if (page.id === 'progress') return progress();
  if (page.id === 'history') return `${heading(m.history, m.historySub)}${list(m.historyRows)}${sectionTitle(m.lastPerformance)}${list(m.exercises.map(([name, sets, reps]) => [name, `${sets} ${m.sets}`, reps]))}`;
  if (page.id === 'rank') return rank();
  if (page.id === 'onboarding') return onboarding(state);
  if (page.id === 'my-coach') return `${heading(m.myCoachTitle, m.myCoachSub)}<section class="k-my-coach">${avatar(m.coachInitials, true)}<h2>${m.coachName}</h2><p>${m.coachRole}</p>${act(m.contactCoach, 'contact-coach', true, 'message-circle')}</section><div class="k-subscription-details">${tag(m.active)}<h2>${m.subscriptionUntil}</h2><p>${m.memberSince}</p></div>${list(m.coachingItems.map(item => [item, '', '']))}`;
  return profileSettings(true);
}

function playerShell(page, body) {
  const focus = ['workout', 'onboarding'].includes(page.id);
  const menu = [['player-home', 'house', m.home], ['nutrition', 'utensils', m.nutrition], ['progress', 'trending-up', m.progress], ['my-coach', 'message-circle', m.captain]];
  return `<div class="k-player-shell"><header class="k-player-header"><button type="button" data-page="site" class="k-wordmark-text">${m.brand}</button><div>${go(m.settings, 'player-settings', false, 'settings-2')}${act(m.notifications, 'notifications', false, 'bell')}</div></header><main class="k-player-content${focus ? ' k-focus-content' : ''}">${body}</main>${focus ? '' : `<nav class="k-bottom-nav">${menu.map(([id, glyph, label]) => `<button type="button" data-page="${id}" aria-current="${page.id === id ? 'page' : 'false'}">${icon(glyph)}<span>${label}</span></button>`).join('')}</nav>`}</div>`;
}

function renderSystem(page) {
  if (page.id === 'dev-ko') return renderPublic({ id: 'ko' });
  if (page.id === 'admin') return `<header class="k-site-nav">${brand()}${go(m.settings, 'coach-settings')}</header><main class="k-system-admin">${heading(m.adminTitle, m.adminSub)}${table([m.captain, m.inbox, m.review], m.adminRows.map(([name, request, status]) => [name, `${request} ${tag(status)}`, act(m.review, 'admin-review')]))}</main>`;
  if (page.id === 'dev-ui') return `<header class="k-site-nav">${brand()}</header><main class="k-system-admin">${heading(m.devTitle, m.devSub)}<div class="k-design-specimen"><h2>${m.siteLead}</h2><p>${m.siteBody}</p><div class="k-action-row">${act(m.devControls[0], 'saved', true)}${act(m.devControls[1], 'saved')}</div>${field(m.devControls[2], m.clientName)}${tag(m.devControls[3])}</div></main>`;
  const item = page.id === 'offline' ? ['wifi-off', m.offlineTitle, m.offlineBody] : page.id === 'suspended' ? ['shield-alert', m.suspendedTitle, m.suspendedBody] : ['clock-3', m.pendingTitle, m.pendingBody];
  return `<header class="k-site-nav">${brand()}</header><main class="k-status-page"><div class="k-status-symbol">${icon(item[0])}</div>${heading(item[1], item[2])}${page.id === 'offline' ? go(m.goHome, 'player-home', true) : act(m.support, 'support', true)}</main>`;
}

const root = document.getElementById('kochivo-premium');
const product = root.querySelector('#k-product');
const groupSelect = root.querySelector('#k-group');
const pageSelect = root.querySelector('#k-page');
const dialog = root.querySelector('#k-dialog');
const initial = () => ({ page: 'site', search: '', appearance: matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light', weight: 60, reps: 10, set: 0, rest: false, eaten: [], water: 1.5, week: 4, day: 0, intakeStep: 0, intake: {}, inbox: 0, replied: false, swaps: {}, swapMeal: 0, extraExercises: [] });
const state = initial();
const remembered = window.openai?.widgetState?.modelContent;
if (remembered?.page) state.page = pageFor(remembered.page).id;
if (['light', 'dark'].includes(remembered?.appearance)) state.appearance = remembered.appearance;
const get = selector => root.querySelector(selector);
get('#k-concept-label').textContent = m.concept;
get('#k-concept-count').textContent = `${pages.length} ${m.page} · ${m.sample}`;
get('#k-group-label').textContent = m.allPages;
get('#k-page-label').textContent = m.page;
get('[data-close-dialog]').innerHTML = icon('x');
get('[data-close-dialog]').setAttribute('aria-label', m.close);
get('#k-appearance').setAttribute('aria-label', m.appearance);
groupSelect.innerHTML = Object.entries(m.groups).map(([id, label]) => `<option value="${id}">${label}</option>`).join('');

function syncIcons() { globalThis.lucide?.createIcons({ attrs: { width: 18, height: 18, 'stroke-width': 1.5 } }); }
function persist() {
  window.openai?.setWidgetState?.({ modelContent: { page: state.page, appearance: state.appearance }, privateContent: null }).catch(() => {});
}
function feedback(value = m.saved) { get('#k-feedback').textContent = value; }
function render() {
  const page = pageFor(state.page);
  root.dataset.appearance = state.appearance;
  get('#k-appearance').innerHTML = icon(state.appearance === 'dark' ? 'sun' : 'moon') + (state.appearance === 'dark' ? m.light : m.dark);
  groupSelect.value = page.group;
  pageSelect.innerHTML = pages.filter(item => item.group === page.group).map(item => `<option value="${item.id}">${item.title}</option>`).join('');
  pageSelect.value = page.id;
  let markup;
  if (page.group === 'public') markup = renderPublic(page);
  else if (page.group === 'auth') markup = renderAuth(page, state);
  else if (page.group === 'captain') markup = captainShell(page, renderCaptain(page, state));
  else if (page.group === 'player') markup = playerShell(page, renderPlayer(page, state));
  else markup = renderSystem(page);
  product.innerHTML = markup;
  product.dataset.page = page.id;
  syncIcons();
}
function navigate(id) {
  dialog.close();
  state.page = pageFor(id).id;
  feedback('');
  render();
  persist();
}
function showDialog(title, html) {
  get('#k-dialog-title').textContent = title;
  get('#k-dialog-content').innerHTML = html;
  dialog.showModal();
  syncIcons();
}
function finishDialog(message = m.saved) { dialog.close(); render(); feedback(message); }

function action(id) {
  if (id === 'toggle-signup') { state.signup = !state.signup; render(); }
  else if (id === 'appearance') { state.appearance = state.appearance === 'dark' ? 'light' : 'dark'; render(); persist(); }
  else if (id === 'coach-menu') showDialog(m.menu, `<div class="k-settings-nav">${['coach-home', 'roster', 'inbox', 'templates', 'leaderboard', 'billing', 'coach-settings'].map(id => go(pageFor(id).title, id)).join('')}</div>`);
  else if (id === 'google-player') navigate('onboarding');
  else if (id === 'google-coach') navigate('coach-home');
  else if (id === 'water') { state.water = Math.min(3, state.water + .25); render(); }
  else if (id === 'finish-set') { state.set = Math.min(2, state.set + 1); state.rest = true; render(); }
  else if (id === 'skip-rest') { state.rest = false; render(); }
  else if (id === 'intake-back') { state.intakeStep = Math.max(0, state.intakeStep - 1); render(); }
  else if (id === 'notifications') showDialog(m.notifications, `<p class="k-dialog-copy">${m.notificationText}</p>${go(m.inbox, pageFor(state.page).group === 'captain' ? 'inbox' : 'progress', true)}`);
  else if (id === 'readiness') showDialog(m.readiness, `<form data-form="dialog">${field(m.sleepQuestion, '7', 'number')}${field(m.sorenessQuestion, m.sorenessValue)}<button type="submit" class="k-button k-primary">${m.save}</button></form>`);
  else if (id === 'invite') showDialog(m.inviteTitle, `<p class="k-dialog-copy">${m.inviteHint}</p><form data-form="invitation">${field(m.name, m.clientName)}${field(m.email, m.playerEmail, 'email')}<button type="submit" class="k-button k-primary">${m.inviteButton}</button></form>`);
  else if (id === 'swap') showDialog(m.swapTitle, `<div class="k-list">${m.mealAlternatives[state.swapMeal].map(([name, amount], i) => `<button type="button" class="k-list-row" data-swap-choice="${i}"><span>${name}<small>${amount}</small></span>${icon('arrow-up-left')}</button>`).join('')}</div>`);
  else if (id === 'checkin') showDialog(m.checkin, `<form data-form="dialog">${field(m.weight, '80.4', 'number')}${field(m.checkinMetrics[1][1], '84', 'number')}<label class="k-field"><span>${m.athleteNotes}</span><textarea rows="3"></textarea></label><button type="submit" class="k-button k-primary">${m.save}</button></form>`);
  else if (id === 'inbody') showDialog(m.inbody, `<form data-form="dialog">${field(m.weight, '80.4', 'number')}${field(m.scanValues[0][1], '36.2', 'number')}${field(m.scanValues[1][1], '18.4', 'number')}<button type="submit" class="k-button k-primary">${m.save}</button></form>`);
  else if (id === 'form-review') showDialog(m.formButton, `<form data-form="dialog"><label class="k-field"><span>${m.formButton}</span><input type="file" accept="video/*"></label><p class="k-dialog-copy">${m.localOnly}</p><button class="k-button k-primary" type="submit">${m.next}</button></form>`);
  else if (id === 'exercise') showDialog(m.addExercise, `<div class="k-list">${m.exercises.map(([name], i) => `<button type="button" data-exercise="${i}" class="k-list-row">${name}${icon('plus')}</button>`).join('')}</div>`);
  else if (id === 'template') showDialog(m.createTemplate, `<form data-form="template">${field(m.name, m.planName)}<button type="submit" class="k-button k-primary">${m.next}</button></form>`);
  else if (id === 'contact-coach' || id === 'support') showDialog(m.contactCoach, `<p class="k-dialog-copy">${m.coachName}</p><p class="k-dialog-copy">${m.localOnly}</p>${go(m.captain, 'coach-site')}`);
  else if (id === 'join-ko') feedback(m.koDone);
  else if (id === 'renew') showDialog(m.renew, `<form data-form="dialog">${field(m.name, m.clientName)}${field(m.month, '1', 'number')}<button type="submit" class="k-button k-primary">${m.save}</button></form>`);
  else if (id === 'admin-review') showDialog(m.review, `<p class="k-dialog-copy">${m.adminRows[0][0]}</p><p class="k-dialog-copy">${m.localOnly}</p>${act(m.save, 'close-saved', true)}`);
  else if (id === 'close-saved') finishDialog();
  else feedback(m.saved);
}

groupSelect.addEventListener('change', () => navigate(pages.find(page => page.group === groupSelect.value).id));
pageSelect.addEventListener('change', () => navigate(pageSelect.value));
get('#k-appearance').addEventListener('click', () => { state.appearance = state.appearance === 'dark' ? 'light' : 'dark'; render(); persist(); });
root.addEventListener('click', event => {
  const target = event.target.closest('button');
  if (!target) return;
  if (target.hasAttribute('data-close-dialog')) { dialog.close(); return; }
  if (target.dataset.anchor) { if (!get(`#k-${target.dataset.anchor}`)) navigate('site'); get(`#k-${target.dataset.anchor}`)?.scrollIntoView({ block: 'start' }); return; }
  if (target.dataset.page) { navigate(target.dataset.page); return; }
  if (target.dataset.action) { action(target.dataset.action); return; }
  if (target.dataset.stepper) {
    const [kind, change] = target.dataset.stepper.split('-');
    state[kind] = Math.max(kind === 'weight' ? 0 : 1, state[kind] + (change === 'plus' ? 1 : -1) * (kind === 'weight' ? 2.5 : 1)); render();
  } else if (target.dataset.meal !== undefined) {
    const index = Number(target.dataset.meal); state.eaten = state.eaten.includes(index) ? state.eaten.filter(i => i !== index) : [...state.eaten, index]; render();
  } else if (target.dataset.swap !== undefined) { state.swapMeal = Number(target.dataset.swap); action('swap'); }
  else if (target.dataset.swapChoice !== undefined) { state.swaps[state.swapMeal] = m.mealAlternatives[state.swapMeal][Number(target.dataset.swapChoice)]; finishDialog(); }
  else if (target.dataset.exercise !== undefined) { state.extraExercises.push(m.exercises[Number(target.dataset.exercise)]); finishDialog(); }
  else if (target.dataset.week !== undefined) { state.week = Number(target.dataset.week); render(); }
  else if (target.dataset.day !== undefined) { state.day = Number(target.dataset.day); render(); }
  else if (target.dataset.inbox !== undefined) { state.inbox = Number(target.dataset.inbox); render(); }
  else if (target.dataset.settings !== undefined) showDialog(m.settingsGroups[Number(target.dataset.settings)], `<p class="k-dialog-copy">${m.localOnly}</p>${act(m.appearance, 'appearance')}<div class="k-form-grid">${field(m.language, m.arabic)}${field(m.units, m.metric)}</div>`);
});
root.addEventListener('input', event => {
  if (event.target.id !== 'k-roster-search') return;
  state.search = event.target.value;
  get('#k-roster-table').innerHTML = rosterTable(state.search);
  syncIcons();
});
root.addEventListener('submit', event => {
  const form = event.target.closest('form');
  if (!form) return;
  event.preventDefault();
  const type = form.dataset.form;
  if (type === 'login') { navigate('coach-home'); return; }
  if (type === 'invite') { if (!state.otp) { state.otp = true; render(); } else navigate('onboarding'); return; }
  if (type === 'forgot') { navigate('reset'); return; }
  if (type === 'reset') { navigate('login'); return; }
  if (type === 'onboarding') {
    state.intake = { ...state.intake, ...Object.fromEntries(new FormData(form)) };
    if (state.intakeStep === 3) { navigate('player-home'); feedback(m.intakeDone); }
    else { state.intakeStep += 1; render(); }
    return;
  }
  if (type === 'reply') { state.replied = true; render(); feedback(m.replySaved); return; }
  if (type === 'invitation') { showDialog(m.inviteReady, `<p class="k-dialog-copy">${m.localOnly}</p>${go(m.inviteHeading, 'invite', true)}`); return; }
  if (type === 'template') { navigate('program'); return; }
  if (type === 'dialog') { finishDialog(); return; }
  feedback();
});
window.addEventListener('openai:set_globals', event => {
  const saved = event.detail?.globals?.widgetState?.modelContent;
  if (saved?.page) { state.page = pageFor(saved.page).id; if (saved.appearance) state.appearance = saved.appearance; render(); }
});
render();
if (globalThis.Tweak) {
  const design = { radius: 14, spacious: true };
  const tweak = new Tweak({ container: root, onChange: () => { root.style.setProperty('--k-radius', `${design.radius}px`); root.style.setProperty('--k-space', design.spacious ? '32px' : '24px'); } });
  tweak.addSlider(design, 'radius', { label: m.radiusControl, min: 8, max: 20, step: 2, unit: 'px' });
  tweak.addToggle(design, 'spacious', { label: m.spaciousControl });
}
window.kochivoConcept = { pages, navigate, state, ready: true, reset() { Object.assign(state, initial()); render(); } };

})();
</script>
