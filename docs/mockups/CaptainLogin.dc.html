<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>دخول الكابتن</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300..900&amp;family=Changa:wght@500..800&amp;family=Manrope:wght@500;700;800&amp;display=swap">
<style>
body{margin:0;background:#0B0E11}
h1,h2,h3,button,.cta,.go,.display{font-family:Manrope,Changa,Alexandria,sans-serif}
button,input{font-family:inherit}
button{cursor:pointer}
a{color:#B6E94F}a:hover{color:#d3f58f}
.mesh{background:radial-gradient(50rem 36rem at 0% 0%,rgba(182,233,79,.12),transparent 60%),radial-gradient(50rem 50rem at 100% 60%,#17222e,transparent 65%),radial-gradient(40rem 30rem at 30% 110%,#131c25,transparent 70%),#0B0E11}
.glass{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.10);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.glass-strong{background:rgba(0,0,0,.40);border:1px solid rgba(255,255,255,.10);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
.cta{background:#B6E94F;color:#101418;box-shadow:0 12px 32px -10px rgba(182,233,79,.55)}
.input{height:54px;width:100%;box-sizing:border-box;border-radius:16px;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.35);color:#F2F2EE;padding:0 16px;font-size:15px;outline:none}
.input:focus{border-color:#B6E94F;box-shadow:0 0 0 3px rgba(182,233,79,.18)}
.lbl{display:flex;flex-direction:column;gap:8px;font-size:13px;color:#9AA0A6}
</style>
</helmet>
<div dir="rtl" class="mesh" style="min-height: 900px; box-sizing: border-box; color: #F2F2EE; font-family: Manrope, Alexandria, sans-serif; display: flex; flex-wrap: wrap; gap: 24px; padding: 24px">

  <main style="flex: 1 1 460px; display: flex; align-items: center; justify-content: center; padding: 24px 0">
    <div class="glass-strong" style="width: 100%; max-width: 440px; border-radius: 32px; padding: 36px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px">
      <a href="Landing.dc.html"><img src="/_blob/a4c76c30a72e976839e1e233247010c5" alt="KOCHIVO" style="height: 26px; width: auto"></a>

      <div class="glass" style="display: flex; padding: 4px; border-radius: 16px; gap: 4px">
        <sc-if value="{{ login }}" hint-placeholder-val="{{ true }}">
          <button style="flex: 1; height: 42px; border-radius: 12px; border: none; font-size: 14px; font-weight: 800; background: #F2F2EE; color: #101418">دخول</button>
          <button onClick="{{ toSignup }}" style="flex: 1; height: 42px; border-radius: 12px; border: none; font-size: 14px; font-weight: 700; background: transparent; color: #F2F2EE">حساب جديد</button>
        </sc-if>
        <sc-if value="{{ signup }}" hint-placeholder-val="{{ false }}">
          <button onClick="{{ toLogin }}" style="flex: 1; height: 42px; border-radius: 12px; border: none; font-size: 14px; font-weight: 700; background: transparent; color: #F2F2EE">دخول</button>
          <button style="flex: 1; height: 42px; border-radius: 12px; border: none; font-size: 14px; font-weight: 800; background: #F2F2EE; color: #101418">حساب جديد</button>
        </sc-if>
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px">
        <h1 style="margin: 0; font-size: 28px; font-weight: 800">{{ title }}</h1>
        <span style="font-size: 14px; color: #9AA0A6">{{ sub }}</span>
      </div>

      <button class="glass" style="height: 54px; border-radius: 16px; color: #F2F2EE; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="#F2F2EE" d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.3z"></path><path fill="#F2F2EE" opacity=".75" d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22z"></path><path fill="#F2F2EE" opacity=".5" d="M6.4 14c-.2-.6-.3-1.3-.3-2s.1-1.4.3-2V7.4H3.1a10 10 0 0 0 0 9.2z"></path><path fill="#F2F2EE" opacity=".9" d="M12 5.9c1.5 0 2.8.5 3.8 1.5l2.9-2.9A10 10 0 0 0 3.1 7.4L6.4 10C7.2 7.7 9.4 5.9 12 5.9z"></path></svg>
        كمّل بـ Google
      </button>

      <div style="display: flex; align-items: center; gap: 12px; font-size: 12px; color: #9AA0A6"><span style="flex: 1; height: 1px; background: rgba(255,255,255,.10)"></span>أو بالإيميل<span style="flex: 1; height: 1px; background: rgba(255,255,255,.10)"></span></div>

      <sc-if value="{{ signup }}" hint-placeholder-val="{{ false }}">
        <label class="lbl">الاسم<input class="input" placeholder="كابتن محمد علي"></label>
      </sc-if>
      <label class="lbl">الإيميل<input class="input" type="email" dir="ltr" placeholder="coach@example.com" style="text-align: right"></label>
      <label class="lbl">
        <span style="display: flex; justify-content: space-between">كلمة السر<sc-if value="{{ login }}" hint-placeholder-val="{{ true }}"><a href="ForgotPassword.dc.html" style="font-size: 13px; font-weight: 700; text-decoration: none">نسيت كلمة السر؟</a></sc-if></span>
        <input class="input" type="password" placeholder="••••••••">
      </label>

      <button class="cta" style="height: 58px; border-radius: 18px; border: none; font-size: 17px; font-weight: 800">{{ action }}</button>

      <span style="font-size: 13px; color: #9AA0A6; text-align: center">لاعب؟ <a href="PlayerLogin.dc.html" style="font-weight: 700; text-decoration: none">ادخل من هنا</a></span>
    </div>
  </main>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { mode: 'login' }; }
  renderVals() {
    const login = this.state.mode === 'login';
    return {
      login, signup: !login,
      title: login ? 'أهلاً يا كابتن' : 'اعمل حسابك كابتن',
      sub: login ? 'ادخل تكمّل مع لاعبينك' : 'دقيقتين وتبعت أول دعوة للاعب',
      action: login ? 'دخول' : 'اعمل الحساب',
      toLogin: () => this.setState({ mode: 'login' }),
      toSignup: () => this.setState({ mode: 'signup' })
    };
  }
}
</script>
</body>
</html>
